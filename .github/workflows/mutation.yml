name: mutation

# Weekly: the run takes about an hour, too slow for every PR. The score may only
# go up; raise --min-score whenever a run lands higher.
on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

jobs:
  safety-modules:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONPATH: compat/mt5_bridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Mutation score (six safety modules)
        run: python scripts/mutation/run_safety.py --workers 4 --min-score 50
