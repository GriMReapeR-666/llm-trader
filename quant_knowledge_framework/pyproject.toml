[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-knowledge-framework"
version = "1.0.0"
description = "Isolated framework for downloading, transcribing, and organizing quantitative finance knowledge"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = [
    "yt-dlp>=2024.1.0",
    "openai-whisper>=20231117",
    "faster-whisper>=1.0.0",
    "numpy>=1.20.0",
    "pandas>=1.5.0",
    "scikit-learn>=1.0.0",
    "hmmlearn>=0.3.0",
    "scipy>=1.7.0",
    "pyyaml>=6.0",
    "requests>=2.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[project.scripts]
quant-knowledge = "quant_framework.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311"]

[tool.ruff]
line-length = 100
target-version = "py39"
