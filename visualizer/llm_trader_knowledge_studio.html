<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="LLM Trader - Cyber-Quant HyperGraph Studio & Knowledge Base Visualizer. Zero-dependency institutional standalone offline application.">
  <title>LLM Trader - Cyber-Quant HyperGraph Studio & Knowledge Base Visualizer</title>

  <style>
    /* Inlined Master Cyber-Quant Terminal Stylesheet */
/**
 * Cyber-Quant HyperGraph Studio - Glassmorphic Terminal Stylesheet
 *
 * Institutional-grade Bloomberg/OLED dark glassmorphic design system:
 * - OLED backdrop (#080c14), Canvas stage (#0d1527), Glass panels (#0f172a)
 * - 16px hardware-accelerated frosted glass blur
 * - High-contrast system typography and monospace code styling
 * - Glowing status indicators and edge-pulse color keys
 * - Sleek cyber scrollbars and ambient keyframe animations
 *
 * Zero external dependencies.
 */

:root {
  /* Palette: Cyber-Quant OLED Dark */
  --bg-oled: #080c14;
  --bg-stage: #0d1527;
  --bg-glass: rgba(15, 23, 42, 0.78);
  --bg-glass-card: rgba(15, 23, 42, 0.88);
  --bg-glass-hover: rgba(30, 41, 59, 0.82);
  --bg-glass-active: rgba(51, 65, 85, 0.85);
  --bg-input: rgba(13, 21, 39, 0.85);

  /* Borders & Highlights */
  --border-glass: rgba(255, 255, 255, 0.08);
  --border-glass-light: rgba(255, 255, 255, 0.14);
  --border-glass-hover: rgba(56, 189, 248, 0.4);
  --border-focus: #38bdf8;

  /* Typography Colors */
  --text-primary: #f8fafc;
  --text-secondary: #94a3b8;
  --text-muted: #64748b;
  --text-dim: #475569;

  /* Status & Signal Indicators */
  --color-emerald: #10b981;   /* Upstream Callers / Active / Pass */
  --color-rose: #f43f5e;      /* Downstream Dependencies / Gated */
  --color-violet: #a855f7;    /* Theoretical Grounding / Quant Math */
  --color-amber: #f59e0b;     /* Guardian Sentinel / Circuit Breakers */
  --color-amber-gold: #facc15;
  --color-cyan: #06b6d4;      /* Ingestion / System / Focus */
  --color-sky: #38bdf8;       /* Primary Brand / Pulses */
  --color-pink: #ec4899;      /* Causal DAG Discovery */
  --color-pink-soft: #f472b6;

  /* Shadows */
  --shadow-glass: 0 8px 32px 0 rgba(0, 0, 0, 0.55), inset 0 1px 0 0 rgba(255, 255, 255, 0.08);
  --shadow-dropdown: 0 16px 48px 0 rgba(0, 0, 0, 0.75), 0 0 0 1px rgba(255, 255, 255, 0.1);
  --shadow-tooltip: 0 12px 36px 0 rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(56, 189, 248, 0.25);
  --shadow-glow-cyan: 0 0 20px rgba(56, 189, 248, 0.35);
  --shadow-glow-emerald: 0 0 16px rgba(16, 185, 129, 0.35);

  /* Fonts */
  --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-mono: "JetBrains Mono", "Fira Code", "SF Mono", Menlo, Consolas, monospace;

  /* Dimensions */
  --top-bar-height: 58px;
}

/* Reset & Box Sizing */
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background-color: var(--bg-oled);
  color: var(--text-primary);
  font-family: var(--font-sans);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  user-select: none;
}

/* --- Global Sleek Scrollbar --- */
::-webkit-scrollbar {
  width: 6px;
  height: 6px;
}
::-webkit-scrollbar-track {
  background: rgba(8, 12, 20, 0.6);
}
::-webkit-scrollbar-thumb {
  background: rgba(100, 116, 139, 0.35);
  border-radius: 3px;
}
::-webkit-scrollbar-thumb:hover {
  background: rgba(148, 163, 184, 0.55);
}

/* --- Canvas Stage Layer --- */
#canvas-stage {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: 1;
  background-color: var(--bg-stage);
}

#graph-canvas {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  display: block;
}

/* --- Top Floating Command Bar --- */
.top-command-bar {
  position: fixed;
  top: 12px;
  left: 16px;
  right: 16px;
  height: var(--top-bar-height);
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 0 16px;
  background: var(--bg-glass);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid var(--border-glass);
  border-radius: 12px;
  box-shadow: var(--shadow-glass);
  pointer-events: auto;
}

/* Brand Badge & Status */
.brand-section {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-shrink: 0;
}

.brand-badge {
  display: flex;
  align-items: center;
  gap: 10px;
  cursor: pointer;
}

.brand-icon {
  width: 28px;
  height: 28px;
  border-radius: 6px;
  background: linear-gradient(135deg, #0284c7, #38bdf8);
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: var(--shadow-glow-cyan);
}

.brand-icon svg {
  width: 18px;
  height: 18px;
  fill: none;
  stroke: #ffffff;
  stroke-width: 2.2;
}

.brand-titles {
  display: flex;
  flex-direction: column;
}

.brand-title {
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: #ffffff;
  display: flex;
  align-items: center;
  gap: 6px;
}

.brand-subtitle {
  font-size: 10px;
  font-family: var(--font-mono);
  color: var(--text-secondary);
  letter-spacing: 0.04em;
}

.status-tag {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 3px 8px;
  border-radius: 20px;
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 600;
  background: rgba(16, 185, 129, 0.12);
  color: var(--color-emerald);
  border: 1px solid rgba(16, 185, 129, 0.28);
  letter-spacing: 0.04em;
}

.status-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background-color: var(--color-emerald);
  animation: pulse-glow 2s infinite ease-in-out;
}

/* Perspective Mode Switcher */
.perspective-switcher {
  display: flex;
  align-items: center;
  background: rgba(13, 21, 39, 0.65);
  padding: 3px;
  border-radius: 8px;
  border: 1px solid var(--border-glass);
}

.perspective-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 12px;
  border: none;
  background: transparent;
  color: var(--text-secondary);
  font-family: var(--font-sans);
  font-size: 12px;
  font-weight: 600;
  border-radius: 6px;
  cursor: pointer;
  transition: all 0.18s ease;
  white-space: nowrap;
}

.perspective-btn:hover {
  color: var(--text-primary);
  background: rgba(255, 255, 255, 0.05);
}

.perspective-btn.active {
  background: rgba(56, 189, 248, 0.18);
  color: var(--color-sky);
  border: 1px solid rgba(56, 189, 248, 0.35);
  box-shadow: 0 0 12px rgba(56, 189, 248, 0.2);
}

/* Layout Selector */
.layout-selector {
  display: flex;
  align-items: center;
  background: rgba(13, 21, 39, 0.65);
  padding: 3px;
  border-radius: 8px;
  border: 1px solid var(--border-glass);
}

.layout-btn {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 6px 10px;
  border: none;
  background: transparent;
  color: var(--text-secondary);
  font-family: var(--font-sans);
  font-size: 11px;
  font-weight: 500;
  border-radius: 6px;
  cursor: pointer;
  transition: all 0.18s ease;
  white-space: nowrap;
}

.layout-btn:hover {
  color: var(--text-primary);
  background: rgba(255, 255, 255, 0.05);
}

.layout-btn.active {
  background: rgba(148, 163, 184, 0.18);
  color: #ffffff;
  border: 1px solid rgba(255, 255, 255, 0.15);
}

/* Global Quick Search */
.search-container {
  position: relative;
  width: 260px;
  flex-shrink: 1;
}

.search-input-wrapper {
  position: relative;
  display: flex;
  align-items: center;
}

.search-icon {
  position: absolute;
  left: 10px;
  width: 14px;
  height: 14px;
  fill: none;
  stroke: var(--text-muted);
  stroke-width: 2;
  pointer-events: none;
}

#quick-search-input {
  width: 100%;
  height: 34px;
  padding: 0 54px 0 32px;
  background: var(--bg-input);
  border: 1px solid var(--border-glass);
  border-radius: 6px;
  color: var(--text-primary);
  font-family: var(--font-mono);
  font-size: 11px;
  outline: none;
  transition: all 0.18s ease;
}

#quick-search-input:focus {
  border-color: var(--border-focus);
  box-shadow: 0 0 12px rgba(56, 189, 248, 0.25);
  background: rgba(15, 23, 42, 0.95);
}

#quick-search-input::placeholder {
  color: var(--text-dim);
  font-family: var(--font-sans);
  font-size: 11px;
}

.search-shortcut-badge {
  position: absolute;
  right: 6px;
  display: inline-flex;
  align-items: center;
  padding: 2px 5px;
  background: rgba(255, 255, 255, 0.06);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 4px;
  font-family: var(--font-mono);
  font-size: 9px;
  color: var(--text-muted);
  pointer-events: none;
}

/* Autocomplete Dropdown */
#search-results-dropdown {
  position: absolute;
  top: 42px;
  left: 0;
  width: 360px;
  max-height: 420px;
  overflow-y: auto;
  background: var(--bg-glass-card);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid var(--border-glass-light);
  border-radius: 8px;
  box-shadow: var(--shadow-dropdown);
  z-index: 150;
  display: none;
}

#search-results-dropdown.visible {
  display: block;
}

.search-result-item {
  display: flex;
  flex-direction: column;
  gap: 3px;
  padding: 8px 12px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.04);
  cursor: pointer;
  transition: background 0.12s ease;
}

.search-result-item:last-child {
  border-bottom: none;
}

.search-result-item:hover,
.search-result-item.selected,
.search-result-item.active {
  background: var(--bg-glass-hover);
  border-left: 3px solid var(--color-sky);
}

.search-result-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.search-result-title {
  font-family: var(--font-mono);
  font-size: 12px;
  font-weight: 600;
  color: var(--text-primary);
  display: flex;
  align-items: center;
  gap: 6px;
}

.search-result-domain {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 10px;
  padding: 1px 6px;
  border-radius: 4px;
  background: rgba(255, 255, 255, 0.05);
  color: var(--text-secondary);
}

.search-result-meta {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 10px;
  color: var(--text-muted);
}

.search-result-summary {
  font-size: 11px;
  color: var(--text-secondary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  margin-top: 1px;
}

.search-empty-msg {
  padding: 16px;
  text-align: center;
  font-size: 11px;
  color: var(--text-muted);
}

/* Camera Action Buttons (Zoom & Fullscreen) */
.camera-controls {
  display: flex;
  align-items: center;
  gap: 4px;
}

.camera-btn {
  width: 32px;
  height: 32px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border: 1px solid var(--border-glass);
  background: rgba(13, 21, 39, 0.65);
  color: var(--text-secondary);
  border-radius: 6px;
  cursor: pointer;
  font-size: 13px;
  font-weight: 600;
  transition: all 0.18s ease;
}

.camera-btn:hover {
  color: #ffffff;
  background: rgba(255, 255, 255, 0.08);
  border-color: rgba(255, 255, 255, 0.2);
}

/* --- Subsystem Filter Checklist Panel --- */
#subsystem-filter-panel {
  position: fixed;
  bottom: 20px;
  right: 20px;
  width: 310px;
  max-height: 480px;
  z-index: 90;
  background: var(--bg-glass);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid var(--border-glass);
  border-radius: 12px;
  box-shadow: var(--shadow-glass);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  transition: transform 0.25s ease, opacity 0.25s ease;
}

#subsystem-filter-panel.collapsed {
  transform: translateY(calc(100% - 44px));
}

.filter-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 14px;
  border-bottom: 1px solid var(--border-glass);
  background: rgba(13, 21, 39, 0.5);
  cursor: pointer;
}

.filter-title {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--text-primary);
  display: flex;
  align-items: center;
  gap: 8px;
}

.filter-header-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}

.filter-all-label {
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 10px;
  color: var(--text-secondary);
  cursor: pointer;
}

.filter-collapse-btn {
  background: transparent;
  border: none;
  color: var(--text-muted);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}

.subsystem-list {
  padding: 6px 10px;
  overflow-y: auto;
  max-height: 400px;
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.subsystem-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 5px 8px;
  border-radius: 6px;
  transition: background 0.12s ease;
  position: relative;
}

.subsystem-item:hover {
  background: rgba(255, 255, 255, 0.04);
}

.subsystem-item-left {
  display: flex;
  align-items: center;
  gap: 8px;
  overflow: hidden;
  cursor: pointer;
}

.subsystem-checkbox {
  appearance: none;
  -webkit-appearance: none;
  width: 14px;
  height: 14px;
  border: 1px solid rgba(255, 255, 255, 0.2);
  border-radius: 3px;
  background: rgba(13, 21, 39, 0.8);
  cursor: pointer;
  display: grid;
  place-content: center;
  flex-shrink: 0;
  transition: all 0.15s ease;
}

.subsystem-checkbox:checked {
  background-color: var(--color-sky);
  border-color: var(--color-sky);
}

.subsystem-checkbox:checked::after {
  content: "";
  width: 8px;
  height: 4px;
  border-left: 2px solid #080c14;
  border-bottom: 2px solid #080c14;
  transform: rotate(-45deg) translate(1px, -1px);
}

.subsystem-checkbox:indeterminate {
  background-color: rgba(56, 189, 248, 0.4);
  border-color: var(--color-sky);
}

.subsystem-checkbox:indeterminate::after {
  content: "";
  width: 8px;
  height: 2px;
  background-color: #ffffff;
}

.subsystem-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
}

.subsystem-name {
  font-size: 11px;
  color: var(--text-primary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.subsystem-item-right {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-shrink: 0;
}

.subsystem-count {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--text-muted);
  padding: 1px 5px;
  background: rgba(255, 255, 255, 0.04);
  border-radius: 4px;
}

.solo-btn {
  display: none;
  padding: 2px 6px;
  background: rgba(56, 189, 248, 0.15);
  border: 1px solid rgba(56, 189, 248, 0.3);
  color: var(--color-sky);
  font-family: var(--font-mono);
  font-size: 9px;
  font-weight: 600;
  border-radius: 4px;
  cursor: pointer;
  text-transform: uppercase;
}

.subsystem-item:hover .solo-btn {
  display: inline-block;
}

.solo-btn:hover {
  background: var(--color-sky);
  color: #080c14;
}

/* --- Active Dependency Legend HUD --- */
#active-dependency-legend {
  position: fixed;
  bottom: 20px;
  left: 270px;
  z-index: 90;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 12px;
  background: var(--bg-glass);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid var(--border-glass);
  border-radius: 20px;
  box-shadow: var(--shadow-glass);
  pointer-events: auto;
}

.legend-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 3px 8px;
  border-radius: 12px;
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 500;
  color: var(--text-secondary);
  background: rgba(255, 255, 255, 0.04);
}

.legend-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
}

.legend-pill.incoming .legend-dot {
  background-color: var(--color-emerald);
  box-shadow: 0 0 6px var(--color-emerald);
}
.legend-pill.incoming {
  color: #a7f3d0;
  border: 1px solid rgba(16, 185, 129, 0.25);
}

.legend-pill.outgoing .legend-dot {
  background-color: var(--color-rose);
  box-shadow: 0 0 6px var(--color-rose);
}
.legend-pill.outgoing {
  color: #fecdd3;
  border: 1px solid rgba(244, 63, 94, 0.25);
}

.legend-pill.grounding .legend-dot {
  background-color: var(--color-violet);
  box-shadow: 0 0 6px var(--color-violet);
}
.legend-pill.grounding {
  color: #e9d5ff;
  border: 1px solid rgba(168, 85, 247, 0.25);
}

/* --- Node Hover Card Tooltip --- */
#node-hover-tooltip {
  position: fixed;
  z-index: 200;
  width: 280px;
  padding: 10px 12px;
  background: var(--bg-glass-card);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid var(--border-glass-light);
  border-radius: 8px;
  box-shadow: var(--shadow-tooltip);
  pointer-events: none;
  display: none;
  transition: opacity 0.12s ease;
}

#node-hover-tooltip.visible {
  display: block;
}

.tooltip-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 6px;
}

.tooltip-title {
  font-family: var(--font-mono);
  font-size: 12px;
  font-weight: 700;
  color: #ffffff;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 190px;
}

.tooltip-domain-tag {
  font-size: 9px;
  font-weight: 600;
  padding: 2px 6px;
  border-radius: 4px;
  text-transform: uppercase;
}

.tooltip-meta-row {
  display: flex;
  align-items: center;
  gap: 8px;
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--text-secondary);
  margin-bottom: 6px;
}

.tooltip-meta-item {
  display: flex;
  align-items: center;
  gap: 3px;
}

.tooltip-summary {
  font-size: 11px;
  line-height: 1.4;
  color: #cbd5e1;
  border-top: 1px solid rgba(255, 255, 255, 0.06);
  padding-top: 6px;
}

/* --- Minimap Radar HUD Frame --- */
#radar-container {
  position: fixed;
  bottom: 20px;
  left: 20px;
  width: 240px;
  height: 160px;
  z-index: 90;
  background: var(--bg-glass);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid var(--border-glass);
  border-radius: 8px;
  box-shadow: var(--shadow-glass);
  overflow: hidden;
}

#radar-canvas {
  width: 100%;
  height: 100%;
  display: block;
  cursor: crosshair;
}

/* --- Ambient Cyber Keyframe Animations --- */
@keyframes pulse-glow {
  0%, 100% {
    opacity: 1;
    transform: scale(1);
    box-shadow: 0 0 6px var(--color-emerald);
  }
  50% {
    opacity: 0.45;
    transform: scale(0.92);
    box-shadow: 0 0 2px var(--color-emerald);
  }
}

@keyframes radar-sweep {
  from {
    transform: rotate(0deg);
  }
  to {
    transform: rotate(360deg);
  }
}

@keyframes fade-in {
  from {
    opacity: 0;
    transform: translateY(4px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* ==========================================================================
   Universal Deep-Dive Slide-Over Drawer (Task 4)
   ========================================================================== */

/* --- Backdrop Overlay --- */
.drawer-backdrop,
#deep-dive-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(4, 7, 14, 0.65);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  z-index: 999;
}

.drawer-backdrop.visible,
#deep-dive-backdrop.visible {
  opacity: 1;
  pointer-events: auto;
}

/* --- Slide-Over Drawer Shell --- */
.deep-dive-drawer,
#deep-dive-drawer {
  position: fixed;
  top: 0;
  right: 0;
  bottom: 0;
  width: 580px;
  max-width: calc(100vw - 24px);
  height: 100vh;
  background: rgba(13, 21, 39, 0.94);
  backdrop-filter: blur(28px);
  -webkit-backdrop-filter: blur(28px);
  border-left: 1px solid rgba(255, 255, 255, 0.1);
  box-shadow: -16px 0 48px rgba(0, 0, 0, 0.75), 0 0 1px rgba(56, 189, 248, 0.2);
  display: flex;
  flex-direction: column;
  transform: translateX(100%);
  transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.35s ease;
  z-index: 1000;
  color: var(--text-primary);
  font-family: var(--font-sans);
  overflow: hidden;
}

.deep-dive-drawer.drawer-open,
#deep-dive-drawer.drawer-open {
  transform: translateX(0);
}

/* --- Drawer Header --- */
.drawer-header {
  flex-shrink: 0;
  position: sticky;
  top: 0;
  background: rgba(15, 23, 42, 0.96);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid rgba(255, 255, 255, 0.08);
  padding: 18px 24px 14px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  z-index: 10;
}

.drawer-meta-pills {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

.drawer-subsystem-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 3px 10px;
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-left-width: 3px;
  border-radius: 6px;
  font-size: 11px;
  font-weight: 600;
  color: var(--text-primary);
  letter-spacing: 0.02em;
}

.drawer-tier-pill {
  padding: 2px 8px;
  background: rgba(168, 85, 247, 0.15);
  border: 1px solid rgba(168, 85, 247, 0.3);
  color: #c084fc;
  border-radius: 9999px;
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
}

.drawer-category-pill {
  padding: 2px 8px;
  background: rgba(56, 189, 248, 0.12);
  border: 1px solid rgba(56, 189, 248, 0.25);
  color: var(--color-cyan);
  border-radius: 9999px;
  font-size: 10px;
  font-weight: 600;
  text-transform: capitalize;
}

.drawer-close-btn {
  margin-left: auto;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  border: 1px solid rgba(255, 255, 255, 0.1);
  background: rgba(255, 255, 255, 0.05);
  color: var(--text-muted);
  font-size: 18px;
  line-height: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all 0.2s ease;
}

.drawer-close-btn:hover {
  background: rgba(244, 63, 94, 0.2);
  border-color: rgba(244, 63, 94, 0.4);
  color: #f43f5e;
  transform: scale(1.05);
}

.drawer-title-row {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.drawer-title {
  font-size: 20px;
  font-weight: 700;
  color: #ffffff;
  margin: 0;
  line-height: 1.25;
  letter-spacing: -0.01em;
}

.drawer-subtitle-row {
  display: flex;
  align-items: center;
  gap: 10px;
}

.drawer-node-id {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text-muted);
  background: rgba(0, 0, 0, 0.35);
  padding: 1px 6px;
  border-radius: 4px;
  border: 1px solid rgba(255, 255, 255, 0.05);
}

.drawer-loc-pill {
  font-family: var(--font-mono);
  font-size: 10px;
  color: #94a3b8;
  background: rgba(148, 163, 184, 0.1);
  padding: 1px 6px;
  border-radius: 4px;
}

/* --- Quick Actions Bar --- */
.drawer-quick-actions {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  padding-top: 2px;
}

.quick-action-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 5px 11px;
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 6px;
  color: var(--text-primary);
  font-size: 11px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.18s ease;
}

.quick-action-btn:hover {
  background: rgba(56, 189, 248, 0.15);
  border-color: rgba(56, 189, 248, 0.4);
  color: #ffffff;
  box-shadow: 0 0 10px rgba(56, 189, 248, 0.2);
}

.quick-action-btn svg {
  flex-shrink: 0;
}

.quick-action-btn.cross-link-btn {
  background: rgba(168, 85, 247, 0.12);
  border-color: rgba(168, 85, 247, 0.3);
  color: #d8b4fe;
}

.quick-action-btn.cross-link-btn:hover {
  background: rgba(168, 85, 247, 0.25);
  border-color: rgba(168, 85, 247, 0.5);
  color: #ffffff;
  box-shadow: 0 0 12px rgba(168, 85, 247, 0.3);
}

.quick-action-btn.copy-success {
  background: rgba(16, 185, 129, 0.2) !important;
  border-color: rgba(16, 185, 129, 0.5) !important;
  color: #34d399 !important;
}

/* --- Master Segmented Lens Toggle Bar --- */
.lens-toggle-container {
  display: flex;
  background: rgba(8, 12, 20, 0.7);
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 9999px;
  padding: 3px;
  gap: 3px;
  margin-top: 4px;
}

.lens-toggle-btn {
  flex: 1;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  padding: 7px 14px;
  background: transparent;
  border: 1px solid transparent;
  border-radius: 9999px;
  color: var(--text-muted);
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
}

.lens-toggle-btn:hover {
  color: var(--text-primary);
  background: rgba(255, 255, 255, 0.03);
}

.lens-toggle-btn.active {
  background: linear-gradient(135deg, rgba(56, 189, 248, 0.22), rgba(129, 140, 248, 0.18));
  border-color: rgba(56, 189, 248, 0.4);
  color: #ffffff;
  box-shadow: 0 2px 10px rgba(56, 189, 248, 0.25), inset 0 0 8px rgba(56, 189, 248, 0.1);
}

.lens-icon {
  font-size: 13px;
}

/* --- Drawer Body Scroll Pane --- */
.drawer-body {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 20px 24px 48px;
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.drawer-body::-webkit-scrollbar {
  width: 6px;
}

.drawer-body::-webkit-scrollbar-thumb {
  background: rgba(255, 255, 255, 0.15);
  border-radius: 3px;
}

.drawer-body::-webkit-scrollbar-thumb:hover {
  background: rgba(56, 189, 248, 0.4);
}

.drawer-section-title {
  font-size: 13px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: #94a3b8;
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 0 0 10px 0;
}

.drawer-subsection-title {
  font-size: 12px;
  font-weight: 600;
  color: #cbd5e1;
  margin: 12px 0 6px 0;
}

/* --- ELI5 View Container & Cards --- */
.eli5-container {
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.eli5-card {
  background: rgba(15, 23, 42, 0.65);
  border: 1px solid rgba(255, 255, 255, 0.07);
  border-radius: 10px;
  padding: 14px 16px;
  position: relative;
  overflow: hidden;
}

.eli5-card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  width: 3px;
  height: 100%;
  background: var(--color-cyan);
}

.eli5-card.analogy-card::before {
  background: #facc15; /* Amber */
}

.eli5-card.protection-card::before {
  background: var(--color-emerald); /* Emerald */
}

.eli5-card.example-card::before {
  background: #a855f7; /* Violet */
}

.eli5-summary-text,
.analogy-text,
.protection-text,
.example-text {
  font-size: 13px;
  line-height: 1.55;
  color: #e2e8f0;
  margin: 0;
}

/* --- Quant Rigor View Container --- */
.quant-container {
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.quant-card {
  background: rgba(15, 23, 42, 0.7);
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 10px;
  padding: 16px;
}

/* Math Formula Container */
.math-formula-box {
  background: rgba(8, 12, 20, 0.9);
  border: 1px solid rgba(56, 189, 248, 0.25);
  border-radius: 8px;
  padding: 16px 20px;
  margin: 8px 0;
  box-shadow: inset 0 0 16px rgba(0, 0, 0, 0.6), 0 0 12px rgba(56, 189, 248, 0.08);
  overflow-x: auto;
}

.math-equation-row {
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: "JetBrains Mono", "Fira Code", monospace;
  font-size: 15px;
  color: #f8fafc;
  line-height: 1.6;
  white-space: nowrap;
}

/* LaTeX Semantic Elements */
.math-fraction {
  display: inline-flex;
  flex-direction: column;
  vertical-align: middle;
  text-align: center;
  padding: 0 4px;
}

.fraction-num {
  font-size: 13px;
  border-bottom: 1.2px solid rgba(255, 255, 255, 0.6);
  padding-bottom: 2px;
}

.fraction-den {
  font-size: 13px;
  padding-top: 2px;
}

.math-op {
  font-size: 19px;
  font-weight: 300;
  vertical-align: -1px;
  margin: 0 2px;
  color: var(--color-cyan);
}

.math-text {
  font-family: var(--font-sans);
  font-style: italic;
  font-size: 13px;
  color: #cbd5e1;
}

.math-bold {
  color: #38bdf8;
  font-weight: 700;
}

.math-cal {
  font-family: serif;
  font-style: italic;
  font-size: 17px;
  color: #f472b6;
}

.math-bb {
  font-weight: 700;
  color: #facc15;
}

/* Variable Definitions Table */
.variable-definitions-container {
  background: rgba(15, 23, 42, 0.6);
  border: 1px solid rgba(255, 255, 255, 0.06);
  border-radius: 8px;
  padding: 12px 14px;
}

.variable-definitions-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 12px;
  margin-top: 6px;
}

.variable-definitions-table th {
  text-align: left;
  padding: 6px 10px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.1);
  color: #94a3b8;
  font-weight: 600;
  font-size: 11px;
  text-transform: uppercase;
}

.variable-definitions-table td {
  padding: 8px 10px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.04);
  vertical-align: middle;
}

.variable-definitions-table tr:last-child td {
  border-bottom: none;
}

.var-symbol {
  font-family: var(--font-mono);
  color: var(--color-cyan);
  font-weight: 600;
  white-space: nowrap;
  width: 30%;
}

.var-meaning {
  color: #e2e8f0;
  line-height: 1.45;
}

.proof-breakdown {
  background: rgba(15, 23, 42, 0.6);
  border: 1px solid rgba(255, 255, 255, 0.06);
  border-radius: 8px;
  padding: 12px 14px;
}

.proof-text {
  font-size: 12px;
  line-height: 1.5;
  color: #cbd5e1;
  margin: 0;
}

/* --- Data Contracts Section --- */
.data-contract-section {
  background: rgba(15, 23, 42, 0.6);
  border: 1px solid rgba(255, 255, 255, 0.06);
  border-radius: 10px;
  padding: 14px;
}

.contract-grid {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.contract-column {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.contract-col-heading {
  font-size: 11px;
  font-weight: 600;
  color: #94a3b8;
  text-transform: uppercase;
}

.contract-chips-flow {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.contract-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  border-radius: 6px;
  font-size: 11px;
  font-family: var(--font-mono);
  background: rgba(8, 12, 20, 0.6);
  border: 1px solid rgba(255, 255, 255, 0.08);
  transition: all 0.18s ease;
}

.contract-chip.input-chip {
  border-color: rgba(56, 189, 248, 0.3);
  color: #e0f2fe;
}

.contract-chip.input-chip .chip-label {
  color: #38bdf8;
  font-weight: 700;
  font-size: 9px;
  padding: 1px 4px;
  background: rgba(56, 189, 248, 0.15);
  border-radius: 3px;
}

.contract-chip.output-chip {
  border-color: rgba(52, 211, 153, 0.3);
  color: #d1fae5;
}

.contract-chip.output-chip .chip-label {
  color: #34d399;
  font-weight: 700;
  font-size: 9px;
  padding: 1px 4px;
  background: rgba(52, 211, 153, 0.15);
  border-radius: 3px;
}

.contract-chip .chip-name {
  font-weight: 600;
}

.contract-chip .chip-type {
  color: #94a3b8;
  font-size: 10px;
}

.contract-chip .chip-origin,
.contract-chip .chip-dest {
  color: #64748b;
  font-size: 10px;
}

.contract-chip.contract-nav-chip {
  cursor: pointer;
}

.contract-chip.contract-nav-chip:hover {
  background: rgba(56, 189, 248, 0.15);
  border-color: rgba(56, 189, 248, 0.6);
  transform: translateY(-1px);
}

.empty-contract-text,
.empty-relation-text {
  font-size: 11px;
  color: #64748b;
  font-style: italic;
}

/* --- Dependency Explorer Section --- */
.dependency-explorer {
  background: rgba(15, 23, 42, 0.6);
  border: 1px solid rgba(255, 255, 255, 0.06);
  border-radius: 10px;
  padding: 14px;
}

.dependency-grid {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.dependency-col {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.dep-col-heading {
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
}

.emerald-text {
  color: #34d399;
}

.rose-text {
  color: #fb7185;
}

.dep-tags-flow {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

/* Emerald Caller Pills */
.caller-tag {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 4px 10px;
  background: rgba(16, 185, 129, 0.12);
  border: 1px solid rgba(16, 185, 129, 0.35);
  border-radius: 9999px;
  color: #34d399;
  font-size: 11px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.18s cubic-bezier(0.16, 1, 0.3, 1);
  font-family: var(--font-sans);
}

.caller-tag:hover {
  background: rgba(16, 185, 129, 0.25);
  border-color: #10b981;
  color: #ffffff;
  transform: translateY(-1px);
  box-shadow: 0 2px 10px rgba(16, 185, 129, 0.35);
}

/* Rose Dependency Pills */
.dependency-tag {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 4px 10px;
  background: rgba(244, 63, 94, 0.12);
  border: 1px solid rgba(244, 63, 94, 0.35);
  border-radius: 9999px;
  color: #fb7185;
  font-size: 11px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.18s cubic-bezier(0.16, 1, 0.3, 1);
  font-family: var(--font-sans);
}

.dependency-tag:hover {
  background: rgba(244, 63, 94, 0.25);
  border-color: #f43f5e;
  color: #ffffff;
  transform: translateY(-1px);
  box-shadow: 0 2px 10px rgba(244, 63, 94, 0.35);
}

/* --- Code Realization Viewer --- */
.code-viewer-container {
  background: rgba(8, 12, 20, 0.95);
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 10px;
  overflow: hidden;
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
}

.code-viewer-toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 14px;
  background: rgba(15, 23, 42, 0.85);
  border-bottom: 1px solid rgba(255, 255, 255, 0.06);
}

.code-meta-info {
  display: flex;
  align-items: center;
  gap: 8px;
  overflow: hidden;
}

.code-file-path {
  font-family: var(--font-mono);
  font-size: 11px;
  color: #94a3b8;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.code-loc-badge {
  font-family: var(--font-mono);
  font-size: 10px;
  padding: 1px 6px;
  background: rgba(255, 255, 255, 0.06);
  border-radius: 4px;
  color: #cbd5e1;
}

.code-copy-btn {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 10px;
  background: rgba(255, 255, 255, 0.06);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 6px;
  color: var(--text-primary);
  font-size: 11px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.18s ease;
}

.code-copy-btn:hover {
  background: rgba(56, 189, 248, 0.2);
  border-color: rgba(56, 189, 248, 0.5);
  color: #ffffff;
}

.code-signature-bar {
  padding: 8px 14px;
  background: rgba(15, 23, 42, 0.5);
  border-bottom: 1px solid rgba(255, 255, 255, 0.04);
  font-family: var(--font-mono);
  font-size: 11px;
  color: #38bdf8;
  overflow-x: auto;
}

.code-scroll-pane {
  padding: 12px 0;
  max-height: 280px;
  overflow-y: auto;
  overflow-x: auto;
  font-family: "JetBrains Mono", "Fira Code", monospace;
  font-size: 12px;
  line-height: 1.5;
}

.code-line {
  display: flex;
  padding: 0 14px;
}

.code-line:hover {
  background: rgba(255, 255, 255, 0.03);
}

.line-number {
  width: 32px;
  flex-shrink: 0;
  text-align: right;
  padding-right: 14px;
  color: #475569;
  user-select: none;
}

.line-content {
  flex: 1;
  white-space: pre;
  color: #e2e8f0;
}

/* Syntax Tokens */
.token-keyword {
  color: #c084fc; /* Purple */
  font-weight: 600;
}

.token-function {
  color: #38bdf8; /* Cyan */
}

.token-class {
  color: #facc15; /* Yellow */
  font-weight: 600;
}

.token-string {
  color: #34d399; /* Green */
}

.token-comment {
  color: #64748b; /* Muted Slate */
  font-style: italic;
}

/* --- Operational Failure Modes & Circuit Breakers --- */
.failure-mode-card {
  background: rgba(15, 23, 42, 0.7);
  border: 1px solid rgba(245, 158, 11, 0.25);
  border-radius: 10px;
  padding: 14px 16px;
  box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
}

.failure-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 10px;
}

.failure-title-group {
  display: flex;
  align-items: center;
  gap: 6px;
}

.failure-title {
  font-size: 12px;
  font-weight: 700;
  color: #f59e0b;
  margin: 0;
  text-transform: uppercase;
  letter-spacing: 0.03em;
}

.guardian-badge {
  padding: 2px 8px;
  border-radius: 9999px;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.05em;
  text-transform: uppercase;
}

.guardian-alert {
  background: rgba(245, 158, 11, 0.2);
  border: 1px solid rgba(245, 158, 11, 0.5);
  color: #fbbf24;
}

.guardian-throttle {
  background: rgba(251, 146, 60, 0.2);
  border: 1px solid rgba(251, 146, 60, 0.5);
  color: #fb923c;
}

.guardian-shutdown {
  background: rgba(244, 63, 94, 0.2);
  border: 1px solid rgba(244, 63, 94, 0.5);
  color: #f43f5e;
  animation: pulse-glow 2s infinite;
}

.failure-body {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.failure-field {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.failure-field-label {
  font-size: 10px;
  font-weight: 600;
  color: #94a3b8;
  text-transform: uppercase;
}

.failure-field-value {
  font-size: 12px;
  color: #e2e8f0;
  line-height: 1.45;
}

/* --- Citations & Academic Grounding --- */
.citations-box {
  background: rgba(15, 23, 42, 0.5);
  border: 1px solid rgba(168, 85, 247, 0.2);
  border-radius: 10px;
  padding: 14px 16px;
}

.citations-header {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 8px;
}

.citation-title {
  font-size: 12px;
  font-weight: 600;
  color: #c084fc;
}

.citation-category-pill {
  margin-left: auto;
  font-size: 10px;
  padding: 2px 7px;
  background: rgba(168, 85, 247, 0.15);
  border: 1px solid rgba(168, 85, 247, 0.3);
  color: #d8b4fe;
  border-radius: 9999px;

.citation-source-title {

.citation-doi-row {

.doi-label {

.doi-code {

/* ==========================================================================

#tour-controls-bar,
.tour-controls-bar {

  transform: translateX(-50%);
  z-index: 100;
  display: flex;
  align-items: center;
  background: rgba(15, 23, 42, 0.9);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid rgba(56, 189, 248, 0.28);
  border-radius: 9999px;
  box-shadow: 0 14px 40px rgba(0, 0, 0, 0.65), 0 0 24px rgba(56, 189, 248, 0.16);

.tour-controls-bar.hidden {

.tour-controls-inner {

.tour-nav-group {

}

.tour-btn {

.tour-btn:hover {

}

.tour-btn:active {

.tour-play-btn {

}

.tour-play-btn.playing {

  border-color: rgba(245, 158, 11, 0.5);

}

.tour-step-btn {

}

.tour-stage-dots {

}

.tour-stage-dot {

  align-items: center;
  justify-content: center;

  border-radius: 9999px;

  color: #64748b;
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 600;
  cursor: pointer;

.tour-stage-dot:hover {

}

.tour-stage-dot.active {

  color: #ffffff;
  box-shadow: 0 0 12px rgba(56, 189, 248, 0.4);

}

.tour-speed-group {
  display: flex;
  align-items: center;
}

.tour-speed-select {
  background: rgba(0, 0, 0, 0.45);
  border: 1px solid rgba(255, 255, 255, 0.12);
  color: #38bdf8;
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 600;
  padding: 4px 8px;
  border-radius: 6px;

}

.tour-speed-select:hover,
.tour-speed-select:focus {

}

.tour-exit-btn {

  height: 32px;
  color: #94a3b8;
  border-color: rgba(244, 63, 94, 0.2);
}

.tour-exit-btn:hover {
  background: rgba(244, 63, 94, 0.18);
  border-color: #f43f5e;
  color: #f43f5e;
  box-shadow: 0 0 10px rgba(244, 63, 94, 0.3);
}

/* --- Floating Microsecond Narrative Card --- */

#tour-narrative-card,
.tour-narrative-card {
  position: fixed;
  top: 76px;
  left: 28px;
  width: 440px;
  max-width: calc(100vw - 56px);
  z-index: 95;
  background: rgba(15, 23, 42, 0.92);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid rgba(56, 189, 248, 0.3);
  border-radius: 14px;
  box-shadow: 0 16px 40px rgba(0, 0, 0, 0.7), 0 0 24px rgba(56, 189, 248, 0.15);
  padding: 18px 20px;
  transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
  pointer-events: auto;
}

.tour-narrative-card.hidden {
  opacity: 0;
  pointer-events: none;
  transform: translateY(-12px);
}

.tour-card-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 8px;
}

.tour-stage-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.04em;
}

.badge-prefix {
  color: #f59e0b;
}

.badge-separator {
  color: #475569;
}

.badge-title {
  color: #e2e8f0;
}

.tour-timestamp {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 700;
  color: #10b981;
  background: rgba(16, 185, 129, 0.12);
  border: 1px solid rgba(16, 185, 129, 0.3);
  padding: 3px 8px;
  border-radius: 6px;
  letter-spacing: 0.02em;
}

.pulse-clock-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #10b981;
  box-shadow: 0 0 8px #10b981;
  animation: clock-pulse 1.5s infinite ease-in-out;
}

.tour-subtitle {
  font-size: 12px;
  color: #94a3b8;
  font-weight: 500;
  margin-bottom: 10px;
}

.tour-narrative-text {
  font-size: 13px;
  line-height: 1.6;
  color: #e2e8f0;
  margin-bottom: 14px;
}

.tour-active-chips-label {
  font-family: var(--font-mono);
  font-size: 9px;
  font-weight: 700;
  color: #64748b;
  letter-spacing: 0.08em;
  margin-bottom: 6px;
}

.tour-active-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  max-height: 110px;
  overflow-y: auto;
}

.tour-chip {
  display: inline-flex;
  align-items: center;
  padding: 3px 9px;
  background: rgba(56, 189, 248, 0.1);
  border: 1px solid rgba(56, 189, 248, 0.25);
  border-radius: 9999px;
  font-family: var(--font-mono);
  font-size: 11px;
  color: #38bdf8;
  cursor: pointer;
  transition: all 0.2s ease;
}

.tour-chip:hover {
  background: rgba(56, 189, 248, 0.25);
  border-color: #38bdf8;
  color: #ffffff;
  box-shadow: 0 0 8px rgba(56, 189, 248, 0.4);
}

@keyframes clock-pulse {
  0%, 100% {
    transform: scale(1);
    opacity: 1;
  }
  50% {
    transform: scale(1.4);
    opacity: 0.6;
  }
}

@keyframes tour-pulse {
  0% {
    box-shadow: 0 0 0 0 rgba(56, 189, 248, 0.5);
  }
  70% {
    box-shadow: 0 0 0 14px rgba(56, 189, 248, 0);
  }
  100% {
    box-shadow: 0 0 0 0 rgba(56, 189, 248, 0);
  }
}

/* ==========================================================================
   Knowledge Matrix & Quant Encyclopedia Library Mode (#knowledge-matrix-view)
   ========================================================================== */

#knowledge-matrix-view,
.knowledge-matrix-view {
  position: fixed;
  inset: 0;
  width: 100vw;
  height: 100vh;
  z-index: 900;
  background: rgba(8, 12, 20, 0.94);
  backdrop-filter: blur(28px);
  -webkit-backdrop-filter: blur(28px);
  display: none;
  flex-direction: column;
  overflow: hidden;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.35s cubic-bezier(0.16, 1, 0.3, 1);
}

#knowledge-matrix-view.matrix-open,
#knowledge-matrix-view.visible,
.knowledge-matrix-view.matrix-open {
  display: flex;
  opacity: 1;
  pointer-events: auto;
}

.matrix-container {
  display: flex;
  flex-direction: column;
  width: 100%;
  height: 100%;
  max-width: 1720px;
  margin: 0 auto;
  padding: 24px 36px 36px;
  box-sizing: border-box;
  overflow: hidden;
}

/* --- Header Section --- */
.matrix-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding-bottom: 20px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.08);
  margin-bottom: 20px;
  flex-shrink: 0;
}

.matrix-header-left {
  display: flex;
  align-items: center;
  gap: 20px;
  flex-wrap: wrap;
}

.matrix-title-group {
  display: flex;
  align-items: center;
  gap: 12px;
}

.matrix-icon {
  font-size: 24px;
  filter: drop-shadow(0 0 10px rgba(56, 189, 248, 0.5));
}

.matrix-title {
  margin: 0;
  font-size: 20px;
  font-weight: 800;
  letter-spacing: 0.06em;
  background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 50%, #38bdf8 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  text-transform: uppercase;
}

.matrix-summary-badge {
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 700;
  padding: 5px 12px;
  border-radius: 9999px;
  background: rgba(56, 189, 248, 0.1);
  border: 1px solid rgba(56, 189, 248, 0.3);
  color: #38bdf8;
  letter-spacing: 0.06em;
  box-shadow: 0 0 12px rgba(56, 189, 248, 0.15);
}

.matrix-close-btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 8px 18px;
  background: rgba(244, 63, 94, 0.12);
  border: 1px solid rgba(244, 63, 94, 0.35);
  color: #fda4af;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s ease;
}

.matrix-close-btn:hover {
  background: rgba(244, 63, 94, 0.25);
  border-color: #f43f5e;
  color: #ffffff;
  box-shadow: 0 0 14px rgba(244, 63, 94, 0.4);
  transform: translateY(-1px);
}

/* --- Multi-Dimensional Filter Bar --- */
.matrix-filter-bar {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 14px 20px;
  background: rgba(15, 23, 42, 0.7);
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 12px;
  margin-bottom: 22px;
  flex-shrink: 0;
  flex-wrap: wrap;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
}

.matrix-search-wrapper {
  position: relative;
  flex: 1 1 300px;
  min-width: 260px;
  display: flex;
  align-items: center;
}

.matrix-search-icon {
  position: absolute;
  left: 14px;
  font-size: 14px;
  opacity: 0.6;
  pointer-events: none;
}

#matrix-search-input,
.matrix-search-input {
  width: 100%;
  padding: 9px 14px 9px 38px;
  background: rgba(8, 12, 20, 0.85);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 8px;
  font-family: var(--font-sans);
  font-size: 13px;
  color: #ffffff;
  outline: none;
  transition: all 0.2s ease;
}

#matrix-search-input:focus,
.matrix-search-input:focus {
  border-color: #38bdf8;
  box-shadow: 0 0 12px rgba(56, 189, 248, 0.35);
  background: rgba(15, 23, 42, 0.95);
}

.matrix-filter-controls {
  display: flex;
  align-items: center;
  gap: 14px;
  flex-wrap: wrap;
}

.matrix-filter-group {
  display: flex;
  align-items: center;
  gap: 8px;
}

.matrix-filter-label {
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 700;
  color: #94a3b8;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  white-space: nowrap;
}

.matrix-filter-select {
  padding: 8px 12px;
  background: rgba(8, 12, 20, 0.85);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 8px;
  font-size: 12px;
  color: #cbd5e1;
  outline: none;
  cursor: pointer;
  transition: all 0.2s ease;
}

.matrix-filter-select:hover,
.matrix-filter-select:focus {
  border-color: #38bdf8;
  color: #ffffff;
  box-shadow: 0 0 8px rgba(56, 189, 248, 0.25);
}

.matrix-filter-select option {
  background: #0f172a;
  color: #cbd5e1;
}

/* --- Card Catalog Grid --- */
#matrix-card-grid,
.matrix-card-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
  gap: 18px;
  flex: 1 1 auto;
  overflow-y: auto;
  padding-right: 6px;
  padding-bottom: 12px;
  box-sizing: border-box;
}

/* Custom Scrollbar for Grid */
.matrix-card-grid::-webkit-scrollbar {
  width: 6px;
}

.matrix-card-grid::-webkit-scrollbar-track {
  background: rgba(15, 23, 42, 0.4);
  border-radius: 4px;
}

.matrix-card-grid::-webkit-scrollbar-thumb {
  background: rgba(56, 189, 248, 0.25);
  border-radius: 4px;
}

.matrix-card-grid::-webkit-scrollbar-thumb:hover {
  background: rgba(56, 189, 248, 0.5);
}

/* --- Individual Matrix Card --- */
.matrix-card {
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  background: rgba(15, 23, 42, 0.65);
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 12px;
  padding: 16px 18px;
  transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.2s ease, box-shadow 0.2s ease;
  position: relative;
  overflow: hidden;
}

.matrix-card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 2px;
  background: linear-gradient(90deg, transparent, rgba(56, 189, 248, 0.5), transparent);
  opacity: 0;
  transition: opacity 0.25s ease;
}

.matrix-card:hover {
  transform: translateY(-2px);
  border-color: rgba(56, 189, 248, 0.4);
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 16px rgba(56, 189, 248, 0.15);
}

.matrix-card:hover::before {
  opacity: 1;
}

.matrix-card.selected,
.matrix-card.active {
  border-color: #38bdf8;
  box-shadow: 0 0 20px rgba(56, 189, 248, 0.35);
}

/* Card Header */
.matrix-card-header {
  margin-bottom: 12px;
}

.matrix-card-badges {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
  margin-bottom: 10px;
}

.matrix-domain-badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 3px 8px;
  border-radius: 6px;
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.02em;
  white-space: nowrap;
}

.matrix-domain-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  display: inline-block;
}

.matrix-tier-badge {
  padding: 2px 7px;
  border-radius: 4px;
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 600;
  background: rgba(148, 163, 184, 0.12);
  border: 1px solid rgba(148, 163, 184, 0.25);
  color: #cbd5e1;
}

.matrix-category-chip {
  padding: 2px 7px;
  border-radius: 4px;
  font-size: 10px;
  font-weight: 600;
  background: rgba(168, 85, 247, 0.12);
  border: 1px solid rgba(168, 85, 247, 0.3);
  color: #c084fc;
}

.matrix-card-title {
  margin: 0;
  font-size: 15px;
  font-weight: 700;
  color: #ffffff;
  line-height: 1.35;
}

/* Card Body */
.matrix-card-body {
  flex: 1 1 auto;
  margin-bottom: 14px;
}

.matrix-card-summary {
  margin: 0 0 10px 0;
  font-size: 12px;
  line-height: 1.55;
  color: #94a3b8;
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.matrix-formula-chip {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 5px 9px;
  background: rgba(8, 12, 20, 0.7);
  border: 1px solid rgba(56, 189, 248, 0.2);
  border-radius: 6px;
  font-family: var(--font-mono);
  font-size: 11px;
  color: #38bdf8;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.formula-icon {
  font-weight: bold;
  color: #a855f7;
}

.formula-text {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* Card Stats */
.matrix-card-stats {
  display: flex;
  align-items: center;
  gap: 8px;
  padding-top: 10px;
  border-top: 1px solid rgba(255, 255, 255, 0.05);
  margin-bottom: 12px;
  font-size: 11px;
  color: #94a3b8;
}

.matrix-stat-item {
  display: inline-flex;
  align-items: center;
  gap: 4px;
}

.matrix-stat-label {
  color: #64748b;
}

.matrix-stat-val.emerald {
  color: #10b981;
}

.matrix-stat-val.rose {
  color: #f43f5e;
}

.matrix-stat-divider {
  color: #475569;
}

.matrix-complexity-tag {
  font-family: var(--font-mono);
  font-size: 10px;
  color: #fbbf24;
  margin-left: auto;
}

/* Card Actions */
.matrix-card-actions {
  display: flex;
  gap: 8px;
  margin-top: auto;
}

.matrix-action-btn {
  flex: 1;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 7px 10px;
  border-radius: 6px;
  font-size: 11px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s ease;
  white-space: nowrap;
}

.matrix-deep-dive-btn {
  background: rgba(56, 189, 248, 0.1);
  border: 1px solid rgba(56, 189, 248, 0.3);
  color: #38bdf8;
}

.matrix-deep-dive-btn:hover {
  background: rgba(56, 189, 248, 0.25);
  border-color: #38bdf8;
  color: #ffffff;
  box-shadow: 0 0 10px rgba(56, 189, 248, 0.3);
}

.matrix-focus-graph-btn {
  background: rgba(168, 85, 247, 0.1);
  border: 1px solid rgba(168, 85, 247, 0.3);
  color: #c084fc;
}

.matrix-focus-graph-btn:hover {
  background: rgba(168, 85, 247, 0.25);
  border-color: #c084fc;
  color: #ffffff;
  box-shadow: 0 0 10px rgba(168, 85, 247, 0.3);
}

/* Empty State */
.matrix-empty-state {
  grid-column: 1 / -1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 60px 20px;
  text-align: center;
}

.matrix-empty-icon {
  font-size: 40px;
  margin-bottom: 12px;
  opacity: 0.6;
}

.matrix-empty-title {
  margin: 0 0 6px 0;
  font-size: 16px;
  color: #e2e8f0;
}

.matrix-empty-subtitle {
  margin: 0;
  font-size: 13px;
  color: #64748b;
}

/* Responsive Breakpoints */
@media (max-width: 1024px) {
  .matrix-container {
    padding: 16px 20px 20px;
  }
  .matrix-filter-bar {
    gap: 12px;
    padding: 10px 14px;
  }
  .matrix-card-grid {
    grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
    gap: 14px;
  }
}

@media (max-width: 640px) {
  .matrix-header {
    flex-direction: column;
    align-items: flex-start;
    gap: 12px;
  }
  .matrix-close-btn {
    align-self: flex-end;
  }
  .matrix-filter-controls {
    width: 100%;
    flex-direction: column;
    align-items: stretch;
  }
  .matrix-filter-select {
    width: 100%;
  }
  .matrix-card-grid {
    grid-template-columns: 1fr;
  }
}
