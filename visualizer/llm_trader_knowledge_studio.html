        { id: 'radar', label: '🎯 Radar', title: 'Concentric Dependency Orbit' },
        { id: 'tree', label: '🌿 Tree', title: 'Hierarchical Lineage Tree' },
        { id: 'force', label: '⚛️ Force', title: 'Dynamic Physics Spring Layout' },
      ];

      layouts.forEach((l, idx) => {
        const btn = document.createElement('button');
        btn.className = `layout-btn ${idx === 0 ? 'active' : ''}`;
        btn.setAttribute('data-layout', l.id);
        btn.setAttribute('title', l.title);
        btn.textContent = l.label;
        btn.addEventListener('click', () => {
          layoutSelector.querySelectorAll('.layout-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          if (this.engine) {
            if (typeof this.engine.switchLayout === 'function') {
              this.engine.switchLayout(l.id);
            } else if (typeof this.engine.setLayout === 'function') {
              this.engine.setLayout(l.id);
            }
          }
        });
        layoutSelector.appendChild(btn);
      });
      topBar.appendChild(layoutSelector);

      // 4. Quick Search Container
      const searchContainer = document.createElement('div');
      searchContainer.className = 'search-container';
      searchContainer.id = 'search';

      const searchWrapper = document.createElement('div');
      searchWrapper.className = 'search-input-wrapper';

      const searchInput = document.createElement('input');
      searchInput.type = 'text';
      searchInput.id = 'quick-search-input';
      searchInput.placeholder = 'Search code, quant models, formulas...';
      searchInput.setAttribute('autocomplete', 'off');
      searchInput.setAttribute('spellcheck', 'false');

      const shortcutBadge = document.createElement('span');
      shortcutBadge.className = 'search-shortcut-badge';
      shortcutBadge.textContent = '/ or ⌘K';

      searchWrapper.appendChild(searchInput);
      searchWrapper.appendChild(shortcutBadge);

      const searchDropdown = document.createElement('div');
      searchDropdown.id = 'search-results-dropdown';
      searchDropdown.className = 'search-dropdown';

      searchContainer.appendChild(searchWrapper);
      searchContainer.appendChild(searchDropdown);
      topBar.appendChild(searchContainer);

      this._bindSearchInput(searchInput, searchDropdown);

      // 5. Camera Controls
      const cameraControls = document.createElement('div');
      cameraControls.className = 'camera-controls';

      const btnZoomIn = document.createElement('button');
      btnZoomIn.className = 'camera-btn';
      btnZoomIn.id = 'btn-zoom-in';
      btnZoomIn.setAttribute('title', 'Zoom In (+)');
      btnZoomIn.textContent = '+';
      btnZoomIn.addEventListener('click', () => {
        if (this.engine && typeof this.engine.zoomAtScreen === 'function') {
          this.engine.zoomAtScreen(this.engine.width / 2, this.engine.height / 2, 1.25);
        }
      });

      const btnZoomOut = document.createElement('button');
      btnZoomOut.className = 'camera-btn';
      btnZoomOut.id = 'btn-zoom-out';
      btnZoomOut.setAttribute('title', 'Zoom Out (−)');
      btnZoomOut.textContent = '−';
      btnZoomOut.addEventListener('click', () => {
        if (this.engine && typeof this.engine.zoomAtScreen === 'function') {
          this.engine.zoomAtScreen(this.engine.width / 2, this.engine.height / 2, 0.8);
        }
      });

      const btnReset = document.createElement('button');
      btnReset.className = 'camera-btn';
      btnReset.id = 'btn-reset-camera';
      btnReset.setAttribute('title', 'Reset Camera View (⟲)');
      btnReset.textContent = '⟲';
      btnReset.addEventListener('click', () => {
        if (this.engine && typeof this.engine.resetCamera === 'function') {
          this.engine.resetCamera();
        }
      });

      const btnFullscreen = document.createElement('button');
      btnFullscreen.className = 'camera-btn';
      btnFullscreen.id = 'btn-fullscreen';
      btnFullscreen.setAttribute('title', 'Toggle Fullscreen (F11)');
      btnFullscreen.textContent = '⛶';
      btnFullscreen.addEventListener('click', () => {
        if (typeof document !== 'undefined') {
          if (!document.fullscreenElement) {
            if (document.documentElement && document.documentElement.requestFullscreen) {
              document.documentElement.requestFullscreen();
            }
          } else {
            if (document.exitFullscreen) {
              document.exitFullscreen();
            }
          }
        }
      });

      cameraControls.appendChild(btnZoomIn);
      cameraControls.appendChild(btnZoomOut);
      cameraControls.appendChild(btnReset);
      cameraControls.appendChild(btnFullscreen);
      topBar.appendChild(cameraControls);
    }

    _bindSearchInput(input, dropdown) {
      input.addEventListener('input', () => {
        const query = input.value;
        const nodes = (this.engine && this.engine.nodes) || this.data.nodes || [];
        this.searchResults = fuzzySearch(nodes, query, 10);
        this.selectedSearchIndex = this.searchResults.length > 0 ? 0 : -1;
        this._renderSearchResults(dropdown);
      });

      input.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowDown') {
          if (this.searchResults.length > 0) {
            if (typeof e.preventDefault === 'function') e.preventDefault();
            this.selectedSearchIndex = (this.selectedSearchIndex + 1) % this.searchResults.length;
            this._updateSelectedSearchItem(dropdown);
          }
        } else if (e.key === 'ArrowUp') {
          if (this.searchResults.length > 0) {
            if (typeof e.preventDefault === 'function') e.preventDefault();
            this.selectedSearchIndex = (this.selectedSearchIndex - 1 + this.searchResults.length) % this.searchResults.length;
            this._updateSelectedSearchItem(dropdown);
          }
        } else if (e.key === 'Enter') {
          if (this.selectedSearchIndex >= 0 && this.selectedSearchIndex < this.searchResults.length) {
            if (typeof e.preventDefault === 'function') e.preventDefault();
            const chosen = this.searchResults[this.selectedSearchIndex];
            this._selectNodeFromSearch(chosen, input, dropdown);
          }
        } else if (e.key === 'Escape') {
          this._closeSearchDropdown(dropdown);
          if (typeof input.blur === 'function') input.blur();
        }
      });

      // Close dropdown when clicking outside
      if (typeof document !== 'undefined') {
        document.addEventListener('click', (e) => {
          if (input.contains && dropdown.contains) {
            if (!input.contains(e.target) && !dropdown.contains(e.target)) {
              this._closeSearchDropdown(dropdown);
            }
          }
        });
      }
    }

    _renderSearchResults(dropdown) {
      dropdown.innerHTML = '';

      if (this.searchResults.length === 0) {
        const emptyMsg = document.createElement('div');
        emptyMsg.className = 'search-empty-msg';
        emptyMsg.textContent = 'No matching components or formulas';
        dropdown.appendChild(emptyMsg);
        dropdown.classList.add('visible');
        dropdown.style.display = 'block';
        return;
      }

      this.searchResults.forEach((node, idx) => {
        const item = document.createElement('div');
        item.className = `search-result-item ${idx === this.selectedSearchIndex ? 'selected active' : ''}`;
        item.setAttribute('data-index', String(idx));
        item.setAttribute('data-node-id', node.id);

        const subColor = SUBSYSTEM_COLORS[node.subsystem_id] || DEFAULT_COLOR;
        const callersCount = (node.callers || []).length;
        const depsCount = (node.dependencies || []).length;

        item.innerHTML = `
          <div class="search-result-header">
            <span class="search-result-title">
              <span style="display:inline-block;width:8px;height:8px;border-radius:50%;background-color:${subColor};"></span>
              ${node.name || node.id}
            </span>
            <span class="search-result-domain" style="border-left: 2px solid ${subColor};">
              ${node.subsystem_name || `Domain ${node.subsystem_id}`}
            </span>
          </div>
          <div class="search-result-meta">
            <span>Tier: ${node.tier_level || node.tier || 'L1'}</span>
            <span>•</span>
            <span>← ${callersCount} callers</span>
            <span>•</span>
            <span>→ ${depsCount} deps</span>
          </div>
          <div class="search-result-summary">${node.plain_english_summary || ''}</div>
        `;

        item.addEventListener('click', () => {
          const input = this.container.querySelector('#quick-search-input');
          this._selectNodeFromSearch(node, input, dropdown);
        });

        dropdown.appendChild(item);
      });

      dropdown.classList.add('visible');
      dropdown.style.display = 'block';
    }

    _updateSelectedSearchItem(dropdown) {
      const items = dropdown.querySelectorAll('.search-result-item');
      items.forEach((item, idx) => {
        if (idx === this.selectedSearchIndex) {
          item.classList.add('selected');
          item.classList.add('active');
          if (item.scrollIntoViewIfNeeded) {
            item.scrollIntoViewIfNeeded(false);
          }
        } else {
          item.classList.remove('selected');
          item.classList.remove('active');
        }
      });
    }

    _selectNodeFromSearch(node, input, dropdown) {
      if (!node) return;
      if (input) input.value = node.name || node.id;
      this._closeSearchDropdown(dropdown);

      if (this.engine) {
        if (typeof this.engine.focusNode === 'function') {
          this.engine.focusNode(node.id);
        }
        if (typeof this.engine.selectNode === 'function') {
          this.engine.selectNode(node.id);
        }
      }

      if (this.onNodeSelected) {
        this.onNodeSelected(node);
      }
    }

    _closeSearchDropdown(dropdown) {
      if (!dropdown) return;
      dropdown.classList.remove('visible');
      dropdown.style.display = 'none';
      this.searchResults = [];
      this.selectedSearchIndex = -1;
    }

    _mountSubsystemFilterPanel() {
      let panel = this.container.querySelector('#subsystem-filter-panel');
      if (!panel) {
        panel = document.createElement('div');
        panel.id = 'subsystem-filter-panel';
        this.container.appendChild(panel);
      } else {
        panel.innerHTML = '';
      }

      const subsystems = this.data.subsystems || [];
      const nodes = (this.engine && this.engine.nodes) || this.data.nodes || [];

      // Calculate node counts per subsystem
      const counts = {};
      for (const n of nodes) {
        counts[n.subsystem_id] = (counts[n.subsystem_id] || 0) + 1;
      }

      // Filter header
      const header = document.createElement('div');
      header.className = 'filter-header';

      const title = document.createElement('div');
      title.className = 'filter-title';
      title.innerHTML = `<span>Operational Domains</span>`;

      const actions = document.createElement('div');
      actions.className = 'filter-header-actions';

      const toggleAllLabel = document.createElement('label');
      toggleAllLabel.className = 'filter-all-label';

      const toggleAll = document.createElement('input');
      toggleAll.type = 'checkbox';
      toggleAll.id = 'filter-toggle-all';
      toggleAll.checked = true;

      const toggleAllText = document.createElement('span');
      toggleAllText.textContent = 'All';

      toggleAllLabel.appendChild(toggleAll);
      toggleAllLabel.appendChild(toggleAllText);

      const collapseBtn = document.createElement('button');
      collapseBtn.className = 'filter-collapse-btn';
      collapseBtn.id = 'filter-collapse-toggle';
      collapseBtn.setAttribute('title', 'Collapse Panel');
      collapseBtn.textContent = '▾';
      collapseBtn.addEventListener('click', () => {
        panel.classList.toggle('collapsed');
        collapseBtn.textContent = panel.classList.contains('collapsed') ? '▴' : '▾';
      });

      actions.appendChild(toggleAllLabel);
      actions.appendChild(collapseBtn);
      header.appendChild(title);
      header.appendChild(actions);
      panel.appendChild(header);

      // Subsystem items list
      const list = document.createElement('div');
      list.className = 'subsystem-list';

      const checkboxes = [];

      for (let id = 1; id <= 12; id++) {
        const sub = subsystems.find(s => s.id === id) || { id, name: `Domain ${id}` };
        const color = SUBSYSTEM_COLORS[id] || DEFAULT_COLOR;
        const count = counts[id] || 0;

        const item = document.createElement('div');
        item.className = 'subsystem-item';
        item.setAttribute('data-subsystem-id', String(id));

        const leftLabel = document.createElement('label');
        leftLabel.className = 'subsystem-item-left';

        const cb = document.createElement('input');
        cb.type = 'checkbox';
        cb.className = 'subsystem-checkbox';
        cb.setAttribute('data-subsystem-id', String(id));
        cb.checked = true;
        checkboxes.push(cb);

        cb.addEventListener('change', () => {
          if (!this.engine.hiddenSubsystems) {
            this.engine.hiddenSubsystems = new Set();
          }
          if (cb.checked) {
            this.engine.hiddenSubsystems.delete(id);
          } else {
            this.engine.hiddenSubsystems.add(id);
          }
          this._updateToggleAllState(toggleAll, checkboxes);
        });

        const dot = document.createElement('span');
        dot.className = 'subsystem-dot';
        dot.style.backgroundColor = color;

        const nameSpan = document.createElement('span');
        nameSpan.className = 'subsystem-name';
        nameSpan.setAttribute('title', sub.name);
        nameSpan.textContent = sub.name;

        leftLabel.appendChild(cb);
        leftLabel.appendChild(dot);
        leftLabel.appendChild(nameSpan);

        const rightDiv = document.createElement('div');
        rightDiv.className = 'subsystem-item-right';

        const countBadge = document.createElement('span');
        countBadge.className = 'subsystem-count';
        countBadge.textContent = String(count);

        const soloBtn = document.createElement('button');
        soloBtn.className = 'solo-btn';
        soloBtn.setAttribute('data-subsystem-id', String(id));
        soloBtn.setAttribute('title', 'Isolate this domain');
        soloBtn.textContent = 'Solo';

        soloBtn.addEventListener('click', (e) => {
          if (typeof e.stopPropagation === 'function') e.stopPropagation();
          if (!this.engine.hiddenSubsystems) {
            this.engine.hiddenSubsystems = new Set();
          }

          this.engine.hiddenSubsystems.clear();
          for (let sid = 1; sid <= 12; sid++) {
            if (sid !== id) {
              this.engine.hiddenSubsystems.add(sid);
            }
          }

          checkboxes.forEach(chk => {
            const chkId = parseInt(chk.getAttribute('data-subsystem-id'), 10);
            chk.checked = (chkId === id);
          });

          this._updateToggleAllState(toggleAll, checkboxes);
        });

        rightDiv.appendChild(countBadge);
        rightDiv.appendChild(soloBtn);

        item.appendChild(leftLabel);
        item.appendChild(rightDiv);
        list.appendChild(item);
      }

      panel.appendChild(list);

      // Toggle All handler
      toggleAll.addEventListener('change', () => {
        const checkState = toggleAll.checked;
        if (!this.engine.hiddenSubsystems) {
          this.engine.hiddenSubsystems = new Set();
        }

        checkboxes.forEach(chk => {
          chk.checked = checkState;
          const sid = parseInt(chk.getAttribute('data-subsystem-id'), 10);
          if (checkState) {
            this.engine.hiddenSubsystems.delete(sid);
          } else {
            this.engine.hiddenSubsystems.add(sid);
          }
        });
        toggleAll.indeterminate = false;
      });
    }

    _updateToggleAllState(toggleAll, checkboxes) {
      if (!toggleAll) return;
      let checkedCount = 0;
      checkboxes.forEach(cb => {
        if (cb.checked) checkedCount++;
      });

      if (checkedCount === checkboxes.length) {
        toggleAll.checked = true;
        toggleAll.indeterminate = false;
      } else if (checkedCount === 0) {
        toggleAll.checked = false;
        toggleAll.indeterminate = false;
      } else {
        toggleAll.checked = false;
        toggleAll.indeterminate = true;
      }
    }

    _mountActiveDependencyLegend() {
      let legend = this.container.querySelector('#active-dependency-legend');
      if (!legend) {
        legend = document.createElement('div');
        legend.id = 'active-dependency-legend';
        this.container.appendChild(legend);
      } else {
        legend.innerHTML = '';
      }

      const pills = [
        { type: 'incoming', label: '← Incoming Callers', title: 'Subsystems calling or requesting data from selected component' },
        { type: 'outgoing', label: '→ Outgoing Dependencies', title: 'Subsystems imported and executed by selected component' },
        { type: 'grounding', label: '✦ Theoretical Grounding', title: 'Theoretical mathematical theorems & proofs cross-linked to code' },
      ];

      pills.forEach(p => {
        const pill = document.createElement('span');
        pill.className = `legend-pill ${p.type}`;
        pill.setAttribute('title', p.title);
        pill.innerHTML = `<span class="legend-dot"></span><span>${p.label}</span>`;
        legend.appendChild(pill);
      });
    }

    _mountNodeHoverTooltip() {
      let tooltip = this.container.querySelector('#node-hover-tooltip');
      if (!tooltip) {
        tooltip = document.createElement('div');
        tooltip.id = 'node-hover-tooltip';
        tooltip.className = 'hover-card-tooltip';
        this.container.appendChild(tooltip);
      }
    }

    _bindEngineCallbacks() {
      if (!this.engine) return;

      const prevHover = this.engine.onNodeHover;
      this.engine.onNodeHover = (node) => {
        if (prevHover) prevHover(node);
        this._updateTooltip(node);
      };
    }

    _updateTooltip(node) {
      const tooltip = this.container.querySelector('#node-hover-tooltip');
      if (!tooltip) return;

      if (!node) {
        tooltip.classList.remove('visible');
        tooltip.style.display = 'none';
        return;
      }

      const subColor = SUBSYSTEM_COLORS[node.subsystem_id] || DEFAULT_COLOR;
      const callersCount = (node.callers || []).length;
      const depsCount = (node.dependencies || []).length;
      const subName = node.subsystem_name || `Domain ${node.subsystem_id}`;

      tooltip.innerHTML = `
        <div class="tooltip-header">
          <span class="tooltip-title">${node.name || node.id}</span>
          <span class="tooltip-domain-tag" style="background: ${subColor}22; color: ${subColor}; border: 1px solid ${subColor}55;">
            ${subName}
          </span>
        </div>
        <div class="tooltip-meta-row">
          <span class="tooltip-meta-item">Tier: <strong style="color:#ffffff;">${node.tier_level || node.tier || 'L1'}</strong></span>
          <span>•</span>
          <span class="tooltip-meta-item">Callers: <strong style="color:${SUBSYSTEM_COLORS[3]};">${callersCount}</strong></span>
          <span>•</span>
          <span class="tooltip-meta-item">Deps: <strong style="color:${SUBSYSTEM_COLORS[7]};">${depsCount}</strong></span>
        </div>
        <div class="tooltip-summary">
          ${node.plain_english_summary || 'Component operational node in autonomous trading engine.'}
        </div>
      `;

      // Position tooltip near cursor on screen
      if (this.engine && typeof this.engine.worldToScreen === 'function' && typeof node.x === 'number') {
        const screenPos = this.engine.worldToScreen(node.x, node.y);
        const winW = (typeof window !== 'undefined' && window.innerWidth) || 1280;
        const winH = (typeof window !== 'undefined' && window.innerHeight) || 720;
        const tipX = Math.min(winW - 300, Math.max(16, screenPos.x + 20));
        const tipY = Math.min(winH - 150, Math.max(70, screenPos.y - 20));
        tooltip.style.left = `${tipX}px`;
        tooltip.style.top = `${tipY}px`;
      }

      tooltip.classList.add('visible');
      tooltip.style.display = 'block';
    }

    _bindGlobalKeyboardShortcuts() {
      if (typeof window === 'undefined') return;

      window.addEventListener('keydown', (e) => {
        const activeTag = (document.activeElement && document.activeElement.tagName) || '';
        if ((e.key === '/' && activeTag !== 'INPUT' && activeTag !== 'TEXTAREA') ||
            ((e.ctrlKey || e.metaKey) && e.key && e.key.toLowerCase() === 'k')) {
          if (typeof e.preventDefault === 'function') e.preventDefault();
          const input = this.container.querySelector('#quick-search-input');
          if (input) {
            if (typeof input.focus === 'function') input.focus();
            if (typeof input.select === 'function') input.select();
          }
        }
      });
    }
  }

  /**
   * Factory function to initialize and mount HUD onto canvasEngine and DOM container.
   */
  function initHUD(canvasEngine, graphData, container = null) {
    return new HUDControls(canvasEngine, graphData, container);
  }

  // Universal Module Export (Browser & CommonJS / Node)
  if (typeof module !== 'undefined' && module.exports) {
    module.exports = {
      HUDControls,
      initHUD,
      fuzzySearch,
      SUBSYSTEM_COLORS,
    };
  }

  if (typeof global !== 'undefined') {
    global.HUDControls = HUDControls;
    global.initHUD = initHUD;
    global.fuzzySearch = fuzzySearch;
  }
})(typeof window !== 'undefined' ? window : globalThis);

  </script>

  <script>
    // 3. Universal Deep-Dive Slide-Over Drawer
/**
 * Cyber-Quant HyperGraph Studio - Universal Deep-Dive Slide-Over Drawer
 *
 * Provides a slide-over inspection drawer with ELI5 vs Institutional Quant Rigor toggle,
 * LaTeX mathematical equation rendering, parameter definitions, syntax-highlighted copyable
 * code viewer, input/output data contract chips, clickable emerald caller tags, rose dependency
 * tags, circuit breaker cards, and 1-click cross-linking between code files and quantitative theories.
 *
 * Zero external runtime dependencies.
 */

(function (global) {
  'use strict';

  // Subsystem 1..12 Palette and Meta
  const SUBSYSTEM_INFO = {
    1: { name: 'Market Data & Macro Ingestion', color: '#38bdf8' },
    2: { name: 'Macro & Regime Classification', color: '#818cf8' },
    3: { name: 'Alpha Mining & Factor Discovery', color: '#34d399' },
    4: { name: 'Multi-Agent LLM Deliberation', color: '#c084fc' },
    5: { name: 'Causal Inference & DAG Discovery', color: '#f472b6' },
    6: { name: 'Overfit & Deflated Sharpe Gating', color: '#fb923c' },
    7: { name: 'Quantitative Risk Allocation', color: '#f87171' },
    8: { name: 'Continual Learning & Meta-loop', color: '#a78bfa' },
    9: { name: 'Core MT5 Execution Gateway', color: '#4ade80' },
    10: { name: 'Guardian Sentinel & Circuit Breakers', color: '#facc15' },
    11: { name: 'Memory Persistence & State Store', color: '#2dd4bf' },
    12: { name: 'Mission Control & Observability', color: '#60a5fa' },
  };

  const DEFAULT_COLOR = '#94a3b8';

  /**
   * Parse LaTeX math equation into formatted, semantic HTML.
   * Renders Greek letters, fractions, super/subscripts, operators, and matrices.
   * @param {string} latex
   * @returns {string} HTML string
   */
  function formatMathToHtml(latex) {
    if (!latex || typeof latex !== 'string') return '';

    let out = latex.trim();

    // 1. Fractions: \frac{num}{den}
    const fracRegex = /\\frac\{([^{}]+)\}\{([^{}]+)\}/g;
    let iterations = 0;
    while (fracRegex.test(out) && iterations < 10) {
      out = out.replace(fracRegex, (m, num, den) => {
        return `<span class="math-fraction"><span class="fraction-num">${num}</span><span class="fraction-bar"></span><span class="fraction-den">${den}</span></span>`;
      });
      iterations++;
    }

    // 2. Greek Symbols
    const greekMap = {
      '\\\\Delta': 'Δ',
      '\\\\delta': 'δ',
      '\\\\alpha': 'α',
      '\\\\beta': 'β',
      '\\\\gamma': 'γ',
      '\\\\Gamma': 'Γ',
      '\\\\theta': 'θ',
      '\\\\Theta': 'Θ',
      '\\\\lambda': 'λ',
      '\\\\Lambda': 'Λ',
      '\\\\mu': 'μ',
      '\\\\sigma': 'σ',
      '\\\\Sigma': 'Σ',
      '\\\\tau': 'τ',
      '\\\\pi': 'π',
      '\\\\Pi': 'Π',
      '\\\\rho': 'ρ',
      '\\\\omega': 'ω',
      '\\\\Omega': 'Ω',
      '\\\\phi': 'φ',
      '\\\\Phi': 'Φ',
      '\\\\epsilon': 'ε',
      '\\\\varepsilon': 'ε',
      '\\\\eta': 'η',
      '\\\\chi': 'χ',
      '\\\\psi': 'ψ',
      '\\\\Psi': 'Ψ',
      '\\\\zeta': 'ζ',
    };

    for (const [pattern, replacement] of Object.entries(greekMap)) {
      out = out.replace(new RegExp(pattern, 'g'), replacement);
    }

    // 3. Mathematical Operators & Symbols
    const symbolMap = {
      '\\\\sum': '<span class="math-op math-sum">∑</span>',
      '\\\\prod': '<span class="math-op math-prod">∏</span>',
      '\\\\int': '<span class="math-op math-int">∫</span>',
      '\\\\infty': '∞',
      '\\\\times': '×',
      '\\\\cdot': '·',
      '\\\\dots': '…',
      '\\\\cdots': '⋯',
      '\\\\partial': '∂',
      '\\\\nabla': '∇',
      '\\\\in': '∈',
      '\\\\approx': '≈',
      '\\\\propto': '∝',
      '\\\\neq': '≠',
      '\\\\le': '≤',
      '\\\\ge': '≥',
      '\\\\pm': '±',
      '\\\\mid': '|',
      '\\\\quad': '&emsp;',
      '\\\\qquad': '&emsp;&emsp;',
      '\\\\;': '&ensp;',
      '\\\\,': '&hairsp;',
      '\\\\mathbb\\{I\\}': '<span class="math-bb">𝟙</span>',
      '\\\\mathbb\\{R\\}': '<span class="math-bb">ℝ</span>',
      '\\\\mathbb\\{E\\}': '<span class="math-bb">𝔼</span>',
      '\\\\mathcal\\{L\\}': '<span class="math-cal">ℒ</span>',
      '\\\\mathcal\\{D\\}': '<span class="math-cal">𝒟</span>',
      '\\\\mathcal\\{N\\}': '<span class="math-cal">𝒩</span>',
    };

    for (const [pattern, replacement] of Object.entries(symbolMap)) {
      out = out.replace(new RegExp(pattern, 'g'), replacement);
    }

    // 4. \text{...} and \mathbf{...}
    out = out.replace(/\\text\{([^{}]+)\}/g, '<span class="math-text">$1</span>');
    out = out.replace(/\\mathbf\{([^{}]+)\}/g, '<strong class="math-bold">$1</strong>');
    out = out.replace(/\\mathcal\{([^{}]+)\}/g, '<span class="math-cal">$1</span>');

    // 5. Brackets
    out = out.replace(/\\left\(/g, '<span class="math-paren">(</span>');
    out = out.replace(/\\right\)/g, '<span class="math-paren">)</span>');
    out = out.replace(/\\left\[/g, '<span class="math-bracket">[</span>');
    out = out.replace(/\\right\]/g, '<span class="math-bracket">]</span>');
    out = out.replace(/\\left\\{/g, '<span class="math-brace">{</span>');
    out = out.replace(/\\right\\}/g, '<span class="math-brace">}</span>');

    // 6. Subscripts: _{...} and _x
    out = out.replace(/_\{([^{}]+)\}/g, '<sub>$1</sub>');
    out = out.replace(/_([a-zA-Z0-9Δδθλμστβα])/g, '<sub>$1</sub>');

    // 7. Superscripts: ^{...} and ^x
    out = out.replace(/\^\{([^{}]+)\}/g, '<sup>$1</sup>');
    out = out.replace(/\^([a-zA-Z0-9Δδθλμστβα\-+])/g, '<sup>$1</sup>');

    // Clean remaining backslashes for standard identifiers
    out = out.replace(/\\([a-zA-Z]+)/g, '$1');

    return `<div class="math-formula-box"><div class="math-equation-row">${out}</div></div>`;
  }

  /**
   * Minimal lightweight syntax highlighter for Python / code snippets with line numbering.
   * @param {string} code
   * @param {string} [lang='python']
   * @returns {string} HTML string
   */
  function highlightCode(code, lang = 'python') {
    if (!code || typeof code !== 'string') return '';

    const lines = code.split('\n');
    const highlightedLines = lines.map((line, idx) => {
      const lineNum = idx + 1;

      // Escape basic HTML
      let escaped = line
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');

      // Comments: # ...
      let commentPart = '';
      const commentIdx = escaped.indexOf('#');
      if (commentIdx !== -1) {
        commentPart = `<span class="token-comment">${escaped.slice(commentIdx)}</span>`;
        escaped = escaped.slice(0, commentIdx);
      }

      // Strings: "..." or '...'
      escaped = escaped.replace(/(["'])(?:(?=(\\?))\2[\s\S])*?\1/g, '<span class="token-string">$&</span>');

      // Keywords
      const keywords = [
        'def', 'class', 'return', 'import', 'from', 'if', 'else', 'elif',
        'for', 'while', 'in', 'try', 'except', 'finally', 'with', 'as',
        'None', 'True', 'False', 'self', 'lambda', 'async', 'await', 'raise', 'yield'
      ];
      const kwRegex = new RegExp(`\\b(${keywords.join('|')})\\b`, 'g');
      escaped = escaped.replace(kwRegex, '<span class="token-keyword keyword">$1</span>');

      // Function definition names: def fname(
      escaped = escaped.replace(/(<span class="token-keyword keyword">def<\/span>\s+)([a-zA-Z0-9_]+)/g, '$1<span class="token-function">$2</span>');
      // Class names: class CName
      escaped = escaped.replace(/(<span class="token-keyword keyword">class<\/span>\s+)([a-zA-Z0-9_]+)/g, '$1<span class="token-class">$2</span>');

      const fullLine = escaped + commentPart;
      return `<div class="code-line" data-line="${lineNum}"><span class="line-number">${lineNum}</span><span class="line-content">${fullLine || ' '}</span></div>`;
    });

    return `<div class="code-block-highlighted">${highlightedLines.join('')}</div>`;
  }

  /**
   * DeepDiveDrawer Manager Class
   */
  class DeepDiveDrawer {
    /**
     * @param {Object} canvasEngine
     * @param {Object} graphData
     */
    constructor(canvasEngine, graphData = {}) {
      this.engine = canvasEngine;
      this.data = graphData;
      this.nodes = graphData.nodes || [];
      this.edges = graphData.edges || [];
      this.nodeMap = new Map();
      for (const node of this.nodes) {
        this.nodeMap.set(node.id, node);
      }

      this.isOpen = false;
      this.currentNodeId = null;
      this.activeLens = 'eli5'; // 'eli5' | 'quant'

      this.drawerEl = null;
      this.backdropEl = null;

      this._boundOnKeyDown = this._onKeyDown.bind(this);

      this._initDOM();
      this._wireEngine();
    }

    /**
     * Initialize DOM elements (#deep-dive-drawer, #deep-dive-backdrop) and attach listeners.
     */
    _initDOM() {
      if (typeof document === 'undefined') return;

      // Backdrop overlay
      let backdrop = document.getElementById('deep-dive-backdrop');
      if (!backdrop) {
        backdrop = document.createElement('div');
        backdrop.id = 'deep-dive-backdrop';
        backdrop.className = 'drawer-backdrop';
        backdrop.setAttribute('aria-hidden', 'true');
        backdrop.addEventListener('click', () => this.closeDrawer());
        document.body.appendChild(backdrop);
      }
      this.backdropEl = backdrop;

      // Slide-over Drawer
      let drawer = document.getElementById('deep-dive-drawer');
      if (!drawer) {
        drawer = document.createElement('aside');
        drawer.id = 'deep-dive-drawer';
        drawer.className = 'deep-dive-drawer';
        drawer.setAttribute('aria-hidden', 'true');
        drawer.setAttribute('role', 'dialog');
        drawer.setAttribute('aria-labelledby', 'drawer-node-title');
        document.body.appendChild(drawer);
      }
      this.drawerEl = drawer;

      // Keydown listener for Escape key
      if (typeof window !== 'undefined') {
        window.addEventListener('keydown', this._boundOnKeyDown);
      }
    }

    /**
     * Wire up canvas engine event hooks so canvas clicks seamlessly open this drawer.
     */
    _wireEngine() {
      if (!this.engine) return;

      const self = this;
      const prevSelect = this.engine.onNodeSelect;
      this.engine.onNodeSelect = function (node) {
        if (typeof prevSelect === 'function') {
          prevSelect.apply(this, arguments);
        }
        if (node && node.id) {
          self.openDrawer(node.id);
        } else if (!node) {
          // If canvas empty space is clicked, we can keep or close drawer
        }
      };

      const prevSelected = this.engine.onNodeSelected;
      this.engine.onNodeSelected = function (node) {
        if (typeof prevSelected === 'function') {
          prevSelected.apply(this, arguments);
        }
        if (node && node.id) {
          self.openDrawer(node.id);
        }
      };

      // Also wire global hudControls if available
      if (typeof window !== 'undefined' && window.hudControls) {
        const prevHudSelect = window.hudControls.onNodeSelected;
        window.hudControls.onNodeSelected = function (node) {
          if (typeof prevHudSelect === 'function') {
            prevHudSelect.apply(this, arguments);
          }
          if (node && node.id) {
            self.openDrawer(node.id);
          }
        };
      }
    }

    _onKeyDown(e) {
      if (e.key === 'Escape' && this.isOpen) {
        this.closeDrawer();
      }
    }

    /**
     * Open deep-dive drawer for specified node ID.
     * @param {string} nodeId
     */
    openDrawer(nodeId) {
      const node = this.nodeMap.get(nodeId);
      if (!node) {
        console.warn(`[DeepDiveDrawer] Node not found: ${nodeId}`);
        return;
      }

      this.currentNodeId = nodeId;
      this.isOpen = true;

      if (this.drawerEl) {
        this.drawerEl.innerHTML = this.generateDrawerHTML(node);
        this.drawerEl.classList.add('drawer-open');
        this.drawerEl.setAttribute('aria-hidden', 'false');
        this._bindDrawerEvents();
      }

      if (this.backdropEl) {
        this.backdropEl.classList.add('visible');
        this.backdropEl.setAttribute('aria-hidden', 'false');
      }

      // Sync active lens UI
      this._updateLensVisibility();
    }

    /**
     * Close the deep dive drawer.
     */
    closeDrawer() {
      this.isOpen = false;
      if (this.drawerEl) {
        this.drawerEl.classList.remove('drawer-open');
        this.drawerEl.setAttribute('aria-hidden', 'true');
      }
      if (this.backdropEl) {
        this.backdropEl.classList.remove('visible');
        this.backdropEl.setAttribute('aria-hidden', 'true');
      }
    }

    /**
     * Set active lens toggle ('eli5' or 'quant').
     * @param {'eli5'|'quant'} lensName
     */
    setLens(lensName) {
      if (lensName !== 'eli5' && lensName !== 'quant') return;
      this.activeLens = lensName;
      this._updateLensVisibility();
    }

    _updateLensVisibility() {
      if (!this.drawerEl) return;

      // Update toggle buttons
      const buttons = this.drawerEl.querySelectorAll('.lens-toggle-btn');
      for (const btn of buttons) {
        const lens = btn.getAttribute('data-lens');
        if (lens === this.activeLens) {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }
      }

      // Update container views
      const eli5Box = this.drawerEl.querySelector('.eli5-container');
      const quantBox = this.drawerEl.querySelector('.quant-container');

      if (eli5Box) {
        eli5Box.style.display = (this.activeLens === 'eli5') ? 'block' : 'none';
      }
      if (quantBox) {
        quantBox.style.display = (this.activeLens === 'quant') ? 'block' : 'none';
      }
    }

    /**
     * Navigate drawer directly to another node and center canvas camera.
     * @param {string} nodeId
     */
    navigateToNode(nodeId) {
      if (!nodeId) return;
      this.openDrawer(nodeId);
      this.centerCamera();
    }

    /**
     * Smoothly focus canvas camera on current node.
     */
    centerCamera() {
      if (!this.currentNodeId || !this.engine) return;
      if (typeof this.engine.focusNode === 'function') {
        this.engine.focusNode(this.currentNodeId, 1.4);
      }
    }

    /**
     * Switch canvas layout to isolate tree hierarchy.
     */
    isolateTree() {
      if (!this.engine) return;
      if (typeof this.engine.switchLayout === 'function') {
        this.engine.switchLayout('tree');
      }
      if (this.currentNodeId && typeof this.engine.focusNode === 'function') {
        this.engine.focusNode(this.currentNodeId, 1.2);
      }
    }

    /**
     * Copy node's code file path to clipboard.
     */
    copyCodePath() {
      const node = this.nodeMap.get(this.currentNodeId);
      if (!node) return;
      const path = (node.code_realization && node.code_realization.file_path) || node.id;
      this._writeToClipboard(path, '.copy-path-btn', 'Copied Path!');
    }

    /**
     * Copy full code snippet to clipboard.
     */
    copyCodeSnippet() {
      const node = this.nodeMap.get(this.currentNodeId);
      if (!node || !node.code_realization) return;
      const code = node.code_realization.code_snippet || '';
      this._writeToClipboard(code, '.code-copy-btn', 'Copied!');
    }

    _writeToClipboard(text, buttonSelector, successLabel) {
      if (typeof navigator !== 'undefined' && navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(() => {
          this._showButtonSuccess(buttonSelector, successLabel);
        }).catch(() => {
          this._fallbackCopy(text);
          this._showButtonSuccess(buttonSelector, successLabel);
        });
      } else {
        this._fallbackCopy(text);
        this._showButtonSuccess(buttonSelector, successLabel);
      }
    }

    _fallbackCopy(text) {
      if (typeof document === 'undefined') return;
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try {
        document.execCommand('copy');
      } catch (err) {
        console.warn('Clipboard write fallback failed', err);
      }
      document.body.removeChild(ta);
    }

    _showButtonSuccess(selector, label) {
      if (!this.drawerEl) return;
      const btn = this.drawerEl.querySelector(selector);
      if (!btn) return;
      const origText = btn.innerHTML;
      btn.innerHTML = `<span class="copy-success-icon">✓</span> ${label}`;
      btn.classList.add('copy-success');
      setTimeout(() => {
        btn.innerHTML = origText;
        btn.classList.remove('copy-success');
      }, 1600);
    }

    /**
     * Jump along cross-link between code module and quant theory.
     * @param {string} [explicitTargetId]
     */
    jumpCrossLink(explicitTargetId = null) {
      if (explicitTargetId) {
        this.navigateToNode(explicitTargetId);
        return;
      }

      const node = this.nodeMap.get(this.currentNodeId);
      if (!node || !node.cross_links) return;

      let targetId = null;
      if (node.cross_links.implements_theories && node.cross_links.implements_theories.length > 0) {
        targetId = node.cross_links.implements_theories[0];
      } else if (node.cross_links.implemented_by_code && node.cross_links.implemented_by_code.length > 0) {
        targetId = node.cross_links.implemented_by_code[0];
      }

      if (targetId) {
        this.navigateToNode(targetId);
      }
    }

    /**
     * Bind click events inside rendered drawer DOM.
     */
    _bindDrawerEvents() {
      if (!this.drawerEl) return;

      // Close button
      const closeBtn = this.drawerEl.querySelector('.drawer-close-btn');
      if (closeBtn) {
        closeBtn.addEventListener('click', () => this.closeDrawer());
      }

      // Quick Action: Center Camera
      const centerBtn = this.drawerEl.querySelector('[data-action="center-camera"]');
      if (centerBtn) {
        centerBtn.addEventListener('click', () => this.centerCamera());
      }

      // Quick Action: Isolate Tree
      const treeBtn = this.drawerEl.querySelector('[data-action="isolate-tree"]');
      if (treeBtn) {
        treeBtn.addEventListener('click', () => this.isolateTree());
      }

      // Quick Action: Copy Code Path
      const copyPathBtn = this.drawerEl.querySelector('[data-action="copy-path"]');
      if (copyPathBtn) {
        copyPathBtn.addEventListener('click', () => this.copyCodePath());
      }

      // Quick Action: Cross Link Jump
      const crossLinkBtn = this.drawerEl.querySelector('[data-action="cross-link"]');
      if (crossLinkBtn) {
        crossLinkBtn.addEventListener('click', () => {
          const targetId = crossLinkBtn.getAttribute('data-target-id');
          this.jumpCrossLink(targetId);
        });
      }

      // Lens Toggle buttons
      const lensButtons = this.drawerEl.querySelectorAll('.lens-toggle-btn');
      for (const btn of lensButtons) {
        btn.addEventListener('click', () => {
          const lens = btn.getAttribute('data-lens');
          this.setLens(lens);
        });
      }

      // Code copy button
      const codeCopyBtn = this.drawerEl.querySelector('.code-copy-btn');
      if (codeCopyBtn) {
        codeCopyBtn.addEventListener('click', () => this.copyCodeSnippet());
      }

      // Caller Tags Click
      const callerTags = this.drawerEl.querySelectorAll('.caller-tag');
      for (const tag of callerTags) {
        tag.addEventListener('click', () => {
          const targetId = tag.getAttribute('data-node-id');
          this.navigateToNode(targetId);
        });
      }

      // Dependency Tags Click
      const depTags = this.drawerEl.querySelectorAll('.dependency-tag');
      for (const tag of depTags) {
        tag.addEventListener('click', () => {
          const targetId = tag.getAttribute('data-node-id');
          this.navigateToNode(targetId);
        });
      }

      // Contract chip source/target navigation
      const contractChips = this.drawerEl.querySelectorAll('.contract-nav-chip');
      for (const chip of contractChips) {
        chip.addEventListener('click', () => {
          const targetId = chip.getAttribute('data-node-id');
          if (this.nodeMap.has(targetId)) {
            this.navigateToNode(targetId);
          }
        });
      }
    }

    /**
     * Generate rich HTML string for a given node.
     * @param {Object} node
     * @returns {string} HTML markup
     */
    generateDrawerHTML(node) {
      if (!node) return '';

      const subInfo = SUBSYSTEM_INFO[node.subsystem_id] || { name: `Subsystem ${node.subsystem_id}`, color: DEFAULT_COLOR };
      const subColor = subInfo.color;

      // Tier format
      const tierFormatted = (node.tier_level || 'Core').replace(/_/g, ' ');
      const categoryFormatted = (node.category || 'module').replace(/_/g, ' ');

      // Determine cross link target
      let crossLinkTargetId = null;
      let crossLinkLabel = 'Cross-Link Jump';
      let crossLinkTitle = 'Jump to linked concept';
      if (node.cross_links) {
        if (node.cross_links.implements_theories && node.cross_links.implements_theories.length > 0) {
          crossLinkTargetId = node.cross_links.implements_theories[0];
          const targetNode = this.nodeMap.get(crossLinkTargetId);
          crossLinkLabel = `Grounding: ${targetNode ? targetNode.name : crossLinkTargetId}`;
          crossLinkTitle = `Jump to Theoretical Grounding: ${crossLinkTargetId}`;
        } else if (node.cross_links.implemented_by_code && node.cross_links.implemented_by_code.length > 0) {
          crossLinkTargetId = node.cross_links.implemented_by_code[0];
          const targetNode = this.nodeMap.get(crossLinkTargetId);
          crossLinkLabel = `Implementation: ${targetNode ? targetNode.name : crossLinkTargetId}`;
          crossLinkTitle = `Jump to Code Implementation: ${crossLinkTargetId}`;
        }
      }

      // 1. Math formulation HTML
      let mathHtml = '';
      let variablesHtml = '';
      let proofHtml = '';
      if (node.mathematical_formulation) {
        const mf = node.mathematical_formulation;
        if (mf.latex_equation) {
          mathHtml = formatMathToHtml(mf.latex_equation);
        }
        if (mf.variables && typeof mf.variables === 'object') {
          const rows = Object.entries(mf.variables).map(([sym, desc]) => {
            const symHtml = formatMathToHtml(sym).replace(/class="math-formula-box"/g, 'class="var-sym-box"');
            return `<tr><td class="var-symbol">${symHtml || sym}</td><td class="var-meaning">${desc}</td></tr>`;
          }).join('');
          variablesHtml = `
            <div class="variable-definitions-container">
              <h4 class="drawer-subsection-title">Variable & Parameter Mapping</h4>
              <table class="variable-definitions-table">
                <thead>
                  <tr><th>Symbol</th><th>Institutional Financial / Algorithmic Meaning</th></tr>
                </thead>
                <tbody>${rows}</tbody>
              </table>
            </div>`;
        }
        if (mf.algorithmic_proof) {
          proofHtml = `
            <div class="proof-breakdown">
              <h4 class="drawer-subsection-title">Algorithmic Proof & Objective Function</h4>
              <p class="proof-text">${mf.algorithmic_proof}</p>
            </div>`;
        }
      }

      // 2. ELI5 Derived Sections
      const eli5Summary = node.plain_english_summary || 'No Plain English summary provided.';
      
      // Intuitive Analogy
      let intuitiveAnalogy = '';
      if (node.category === 'quant_theory') {
        intuitiveAnalogy = `Think of this like an airplane's flight control equation: instead of guessing where the market wind is blowing, it calculates the exact aerodynamic lift and turbulence so the trading craft never stalls out.`;
      } else if (node.category === 'protective_gate') {
        intuitiveAnalogy = `Think of this like an ultra-sensitive emergency electrical fuse in a high-voltage power grid: the millisecond unexpected voltage spikes occur, it cuts the circuit before precious capital is vaporized.`;
      } else if (node.category === 'agent_role') {
        intuitiveAnalogy = `Think of this like a specialized senior analyst sitting at an investment committee table with veto power, cross-examining every bullish pitch before a dime of money is risked.`;
      } else {
        intuitiveAnalogy = `Think of this like a high-speed telemetry sensor on a Formula-1 car: constantly measuring oil pressure and tire grip to ensure the vehicle drives at maximum speed without blowing the engine.`;
      }

      // Capital Preservation & Protection
      let capitalProtection = '';
      if (node.failure_modes && node.failure_modes.defense_mechanism) {
        capitalProtection = `Protects capital by continuously guarding against ${node.failure_modes.edge_case.toLowerCase()}. Automated response: ${node.failure_modes.defense_mechanism}.`;
      } else {
        capitalProtection = `Prevents unhedged exposure, catastrophic drawdown during black-swan shocks, and model overfitting on historical noise.`;
      }

      // Trading Practical Example
      let tradingExample = `In live trading, when incoming tick feeds or economic surprises flash across the tape, this component executes in < 5ms, validating statistical significance before allowing the MT5 gateway to route order tickets.`;

      // 3. Data Contracts
      let inputsHtml = '<span class="empty-contract-text">None (Source root)</span>';
      if (node.data_contract && node.data_contract.inputs && node.data_contract.inputs.length > 0) {
        inputsHtml = node.data_contract.inputs.map(inp => {
          const isKnownNode = this.nodeMap.has(inp.source_node);

          return `
            <div class="contract-chip input-chip ${navClass}" data-node-id="${inp.source_node}" title="Source: ${inp.source_node}">
              <span class="chip-label">IN</span>
              <span class="chip-name">${inp.name}</span>
              <span class="chip-type">${inp.type}</span>
              <span class="chip-origin">← ${inp.source_node}</span>
            </div>`;
        }).join('');

      let outputsHtml = '<span class="empty-contract-text">None (Terminal sink)</span>';
      if (node.data_contract && node.data_contract.outputs && node.data_contract.outputs.length > 0) {
        outputsHtml = node.data_contract.outputs.map(out => {
          const isKnownNode = this.nodeMap.has(out.target_node);
          const navClass = isKnownNode ? 'contract-nav-chip' : '';

  /**
   * LifecycleTourManager coordinates camera movement, node illumination, edge pulses,
   * narrative card updates, and playback timers for the 7 trade lifecycle stages.
   */
  class LifecycleTourManager {
    /**
     * @param {Object} canvasEngine CanvasEngine instance
     * @param {Object} graphData Initial payload containing lifecycle_stages and nodes
     * @param {HTMLElement} [container=document.body] Root container element
     */
    constructor(canvasEngine, graphData, container = null) {
      this.engine = canvasEngine;
      this.data = graphData || (canvasEngine && canvasEngine.data) || {};
      this.container = container || (typeof document !== 'undefined' ? document.body : null);

      // Load stages from payload or use default fallback
      const rawStages = (this.data.lifecycle_stages && this.data.lifecycle_stages.length === 7)
        ? this.data.lifecycle_stages
        : DEFAULT_LIFECYCLE_STAGES;

      this.stages = rawStages.map((s, idx) => {
        const fallback = DEFAULT_LIFECYCLE_STAGES[idx] || {};
        return {
          stage_index: s.stage_index || idx + 1,
          name: s.name || fallback.name || `Stage ${idx + 1}`,
          subtitle: s.subtitle || fallback.subtitle || '',
          duration_ms: typeof s.duration_ms === 'number' ? s.duration_ms : (fallback.duration_ms || 3000),
          timestamp: s.timestamp || fallback.timestamp || `+${(idx * 18.5).toFixed(1)} ms`,
          active_nodes: Array.isArray(s.active_nodes) ? [...s.active_nodes] : (fallback.active_nodes || []),
          active_edges: Array.isArray(s.active_edges) ? [...s.active_edges] : (fallback.active_edges || []),
          narrative: s.narrative || fallback.narrative || 'Executing algorithmic trade lifecycle step.'
        };
      });

      // Playback state
      this.currentStageIndex = 0;
      this.isPlaying = false;
      this.isActive = false;
      this.speed = 1.0;
      this.timerId = null;

      // Event callbacks
      this.onStageChange = null;
      this.onTourExit = null;
      this.onPlayStateChange = null;

      this._init();
    }

    _init() {
      if (!this.container || typeof document === 'undefined') return;

      this._mountControlsBar();
      this._mountNarrativeCard();
    }

    // --- DOM Mounting ---

    _mountControlsBar() {
      let controlsBar = this.container.querySelector('#tour-controls-bar');
      if (!controlsBar) {
        controlsBar = document.createElement('div');
        controlsBar.id = 'tour-controls-bar';
        controlsBar.className = 'tour-controls-bar hidden';
        controlsBar.style.display = 'none';
        this.container.appendChild(controlsBar);
      }

      controlsBar.innerHTML = `
        <div class="tour-controls-inner">
          <div class="tour-nav-group">
            <button class="tour-btn tour-step-btn" id="tour-prev-btn" title="Previous Stage (←)">

            </button>
            <button class="tour-btn tour-play-btn" id="tour-play-pause-btn" title="Play / Pause (Space)">
              <span class="play-icon">▶</span>
            </button>
            <button class="tour-btn tour-step-btn" id="tour-next-btn" title="Next Stage (→)">

          </div>

          <div class="tour-stage-dots">
            ${this.stages.map((st, i) => `
              <button class="tour-stage-dot ${i === 0 ? 'active' : ''}" data-stage="${i}" title="${st.stage_index}. ${st.name}">
                <span class="dot-num">0${i + 1}</span>
              </button>
            `).join('')}
          </div>

          <div class="tour-speed-group">
            <select class="tour-speed-select" id="tour-speed-selector" title="Playback Speed">

              <option value="1" selected>1.0x</option>
              <option value="2">2.0x</option>
            </select>
          </div>

            <button class="tour-btn tour-exit-btn" id="tour-exit-btn" title="Exit Tour (Esc)">
              <span>✕</span>
            </button>
          </div>
        </div>
      `;

      // Event bindings
      const prevBtn = controlsBar.querySelector('#tour-prev-btn');
      const playBtn = controlsBar.querySelector('#tour-play-pause-btn');
      const nextBtn = controlsBar.querySelector('#tour-next-btn');
      const speedSelect = controlsBar.querySelector('#tour-speed-selector');
      const exitBtn = controlsBar.querySelector('#tour-exit-btn');
      const dots = controlsBar.querySelectorAll('.tour-stage-dot');

      if (prevBtn) prevBtn.addEventListener('click', () => this.prevStage());
      if (playBtn) playBtn.addEventListener('click', () => this.togglePlayPause());
      if (nextBtn) nextBtn.addEventListener('click', () => this.nextStage());
      if (speedSelect) {
        speedSelect.addEventListener('change', (e) => {
          const val = parseFloat(e.target.value);
          if (!isNaN(val)) this.setSpeed(val);
        });
      }
      if (exitBtn) exitBtn.addEventListener('click', () => this.stopTour());

      dots.forEach(dot => {
        dot.addEventListener('click', () => {
          const stageIdx = parseInt(dot.getAttribute('data-stage'), 10);
          if (!isNaN(stageIdx)) this.goToStage(stageIdx);
        });

    _mountNarrativeCard() {
      let card = this.container.querySelector('#tour-narrative-card');

    _renderNarrativeCardContent(card) {
      if (!card) return;
      const stage = this.stages[this.currentStageIndex] || this.stages[0];

      // Retrieve human-friendly node chips
      const chipsHtml = (stage.active_nodes || []).map(nodeId => {
        const node = this._resolveNode(nodeId);

          <div class="tour-stage-badge">
            <span class="badge-prefix">STAGE 0${stage.stage_index} / 0${this.stages.length}</span>

          const nId = chip.getAttribute('data-node-id');

          }

      });

    _resolveNode(nodeId) {
      if (this.engine && this.engine.nodeMap && this.engine.nodeMap.has(nodeId)) {
        return this.engine.nodeMap.get(nodeId);
      }
      if (Array.isArray(this.data.nodes)) {
        return this.data.nodes.find(n => n.id === nodeId);
      }
      return null;
    }

      // Show DOM UI
      const controlsBar = this.container ? this.container.querySelector('#tour-controls-bar') : null;
      const narrativeCard = this.container ? this.container.querySelector('#tour-narrative-card') : null;

      if (controlsBar) {
        controlsBar.classList.remove('hidden');
        controlsBar.style.display = 'flex';
      }
      if (narrativeCard) {
        narrativeCard.classList.remove('hidden');
        narrativeCard.style.display = 'block';
      }

      this.goToStage(this.currentStageIndex || 0);
      this._updatePlayButtonUI();

      if (this.onPlayStateChange) {
        this.onPlayStateChange(true);
      }
    }

    stopTour() {
      const wasActive = this.isActive;
      this.isActive = false;
      this.isPlaying = false;
      this._clearTimer();

      // Hide DOM UI
      const controlsBar = this.container ? this.container.querySelector('#tour-controls-bar') : null;
      const narrativeCard = this.container ? this.container.querySelector('#tour-narrative-card') : null;

      if (controlsBar) {
        controlsBar.classList.add('hidden');
        controlsBar.style.display = 'none';
      }
      if (narrativeCard) {
        narrativeCard.classList.add('hidden');
        narrativeCard.style.display = 'none';
      }

      // Clear engine stage highlights
      if (this.engine) {
        this.engine.activeStageIndex = null;
        if (this.engine.activeStageNodeIds && typeof this.engine.activeStageNodeIds.clear === 'function') {
          this.engine.activeStageNodeIds.clear();
        } else {
          this.engine.activeStageNodeIds = new Set();
        }
        this.engine.activeStageEdges = [];
        if (typeof this.engine.resetCamera === 'function') {
          this.engine.resetCamera();
        }
      }

      this._updatePlayButtonUI();

      if (wasActive && this.onTourExit) {
        this.onTourExit();
      }
      if (wasActive && this.onPlayStateChange) {
        this.onPlayStateChange(false);
      }
    }

    togglePlayPause() {
      if (!this.isActive) {
        this.startTour();
        return;
      }
      if (this.isPlaying) {
        this.pause();
      } else {
        this.play();
      }
    }

    play() {
      this.isPlaying = true;
      this._scheduleNextStageTimer();
      this._updatePlayButtonUI();
      if (this.onPlayStateChange) {
        this.onPlayStateChange(true);
      }
    }

    pause() {
      this.isPlaying = false;
      this._clearTimer();
      this._updatePlayButtonUI();
      if (this.onPlayStateChange) {
        this.onPlayStateChange(false);
      }
    }

    nextStage() {
      const nextIdx = (this.currentStageIndex + 1) % this.stages.length;
      this.goToStage(nextIdx);
    }

    prevStage() {
      const prevIdx = (this.currentStageIndex - 1 + this.stages.length) % this.stages.length;
      this.goToStage(prevIdx);
    }

    goToStage(stageIdx) {
      if (stageIdx < 0 || stageIdx >= this.stages.length) return;
      this.currentStageIndex = stageIdx;
      const stage = this.stages[stageIdx];

      // 1. Highlight Active Nodes and Edges in Engine
      if (this.engine) {
        this.engine.activeStageIndex = stageIdx;
        this.engine.activeStageNodeIds = new Set(stage.active_nodes || []);
        this.engine.activeStageEdges = stage.active_edges ? [...stage.active_edges] : [];

        // Stimulate pulse speeds on active edges
        if (Array.isArray(this.engine.edges)) {
          for (const edge of this.engine.edges) {
            const isActive = (stage.active_edges || []).some(
              ae => ae.source === edge.source && ae.target === edge.target
            );
            if (isActive) {
              edge.pulseSpeed = 0.024; // 3x speed stimulus
            } else {
              edge.pulseSpeed = 0.008;
            }
          }
        }

        // 2. Camera Glide: Center and frame active stage nodes
        this._glideCameraToStageNodes(stage.active_nodes);
      }

      // 3. Update DOM UI
      this._updateStageDotsUI();
      const narrativeCard = this.container ? this.container.querySelector('#tour-narrative-card') : null;
      if (narrativeCard) {
        this._renderNarrativeCardContent(narrativeCard);
      }

      // 4. Timer scheduling if playing
      if (this.isPlaying) {
        this._scheduleNextStageTimer();
      }

      // 5. Notify callback
      if (this.onStageChange) {
        this.onStageChange(stageIdx, stage);
      }
    }

    setSpeed(speedMultiplier) {
      this.speed = Math.max(0.25, Math.min(5.0, speedMultiplier));
      const speedSelect = this.container ? this.container.querySelector('#tour-speed-selector') : null;
      if (speedSelect) {
        speedSelect.value = String(this.speed);
      }
      if (this.isPlaying) {
        this._scheduleNextStageTimer();
      }
    }

    // --- Internal Helpers ---

    _glideCameraToStageNodes(nodeIds) {
      if (!this.engine || !Array.isArray(nodeIds) || nodeIds.length === 0) return;
      if (typeof this.engine.glideTo !== 'function') return;

      let sumX = 0;
      let sumY = 0;
      let count = 0;
      let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;

      for (const id of nodeIds) {
        const node = this._resolveNode(id);
        if (node && typeof node.x === 'number' && typeof node.y === 'number') {
          sumX += node.x;
          sumY += node.y;
          count++;
          if (node.x < minX) minX = node.x;
          if (node.x > maxX) maxX = node.x;
          if (node.y < minY) minY = node.y;
          if (node.y > maxY) maxY = node.y;
        }
      }

      if (count > 0) {
        const centerX = sumX / count;
        const centerY = sumY / count;
        const spanX = maxX - minX;
        const spanY = maxY - minY;
        const maxSpan = Math.max(spanX, spanY, 300);

        // Optimal zoom dynamically fitted to span
        let targetZoom = 1.25;
        if (maxSpan > 1200) targetZoom = 0.65;
        else if (maxSpan > 800) targetZoom = 0.85;
        else if (maxSpan > 500) targetZoom = 1.05;

        this.engine.glideTo(centerX, centerY, targetZoom);
      }
    }

    _scheduleNextStageTimer() {
      this._clearTimer();
      if (!this.isPlaying) return;

      const currentStage = this.stages[this.currentStageIndex];
      const baseDuration = (currentStage && currentStage.duration_ms) || 3000;
      const effectiveDuration = Math.max(400, baseDuration / this.speed);

      this.timerId = setTimeout(() => {
        if (this.isPlaying && this.isActive) {
          this.nextStage();
        }
      }, effectiveDuration);
    }

    _clearTimer() {
      if (this.timerId !== null) {
        clearTimeout(this.timerId);
        this.timerId = null;
      }
    }

    _updatePlayButtonUI() {
      const playBtn = this.container ? this.container.querySelector('#tour-play-pause-btn') : null;
      if (!playBtn) return;

      if (this.isPlaying) {
        playBtn.innerHTML = '<span class="pause-icon">⏸</span>';
        playBtn.setAttribute('title', 'Pause Tour (Space)');
        playBtn.classList.add('playing');
      } else {
        playBtn.innerHTML = '<span class="play-icon">▶</span>';
        playBtn.setAttribute('title', 'Play Tour (Space)');
        playBtn.classList.remove('playing');
      }
    }

    _updateStageDotsUI() {
      const dots = this.container ? this.container.querySelectorAll('.tour-stage-dot') : [];
      dots.forEach((dot, idx) => {
        if (idx === this.currentStageIndex) {
          dot.classList.add('active');
        } else {
          dot.classList.remove('active');
        }
      });
    }
  }

  /**
   * Factory function to instantiate LifecycleTourManager
   */
  function initLifecycleTour(canvasEngine, graphData, container = null) {
    return new LifecycleTourManager(canvasEngine, graphData, container);
  }

  // Universal Module Export (Browser & CommonJS / Node)
  if (typeof module !== 'undefined' && module.exports) {
    module.exports = {
      LifecycleTourManager,
      initLifecycleTour,
      DEFAULT_LIFECYCLE_STAGES
    };
  }

  if (typeof global !== 'undefined') {
    global.LifecycleTourManager = LifecycleTourManager;
    global.initLifecycleTour = initLifecycleTour;
    global.DEFAULT_LIFECYCLE_STAGES = DEFAULT_LIFECYCLE_STAGES;
  }
})(typeof window !== 'undefined' ? window : globalThis);

  <script>
    // 5. Searchable Knowledge Matrix & Quant Encyclopedia
/**
 * Cyber-Quant HyperGraph Studio - Searchable Knowledge Matrix & Quant Encyclopedia Library Mode
 *
 * Provides a full-screen institutional matrix catalog of all 109 core quantitative modules,
 * theories, agent roles, and protective circuit breakers with multi-dimensional filtering
 * (by Domain, Complexity, Category, Text search, and Sorting) and seamless transitions
 * to the graph canvas and universal deep-dive drawer.
 *
 * Zero external runtime dependencies.
 */

(function (global) {
  'use strict';

  // Subsystem 1..12 Palette and Meta
  const SUBSYSTEM_INFO = {
    1: { name: 'Market Data & Macro Ingestion', color: '#38bdf8' },
    2: { name: 'Macro & Regime Classification', color: '#818cf8' },
    3: { name: 'Alpha Mining & Factor Discovery', color: '#34d399' },
    4: { name: 'Multi-Agent LLM Deliberation', color: '#c084fc' },
    5: { name: 'Causal Inference & DAG Discovery', color: '#f472b6' },
    6: { name: 'Overfit & Deflated Sharpe Gating', color: '#fb923c' },
    7: { name: 'Quantitative Risk Allocation', color: '#f87171' },
    8: { name: 'Continual Learning & Meta-loop', color: '#a78bfa' },
    9: { name: 'Core MT5 Execution Gateway', color: '#4ade80' },
    10: { name: 'Guardian Sentinel & Circuit Breakers', color: '#facc15' },
    11: { name: 'Memory Persistence & State Store', color: '#2dd4bf' },
    12: { name: 'Mission Control & Observability', color: '#60a5fa' },
  };

  const DEFAULT_COLOR = '#94a3b8';

  const CATEGORY_LABELS = {
    all: 'All Categories',
    quant_theory: 'Quant Theories',
    code_module: 'Code Modules',
    agent_role: 'Agent Roles',
    protective_gate: 'Protective Gates',
  };

  const COMPLEXITY_LABELS = {
    all: 'All Complexity Levels',
    foundational: 'Foundational (Beginner)',
    intermediate: 'Intermediate (Strategy)',
    advanced: 'Advanced Quant (PhD/Institutional)',
  };

  const DEFAULT_FILTERS = {
    search: '',
    domain: 'all',
    complexity: 'all',
    category: 'all',
    sort: 'name',
  };

  /**
   * Helper to map a node to one of three normalized complexity tiers:
   * 'foundational', 'intermediate', 'advanced'
   */
  function getNodeComplexity(node) {
    if (!node) return 'intermediate';
    if (node.complexity) {
      const c = String(node.complexity).toLowerCase();
      if (c.includes('found') || c.includes('begin')) return 'foundational';
      if (c.includes('inter')) return 'intermediate';
      if (c.includes('adv') || c.includes('phd')) return 'advanced';
    }
    const tier = node.tier_level || node.tier || '';
    if (tier === 'L0_Gateway' || tier === 'L3_Persistence') {
      return 'foundational';
    }
    if (tier === 'L1_Orchestration') {
      return 'intermediate';
    }
    if (tier === 'L2_Strategy_Core' || node.category === 'quant_theory') {
      return 'advanced';
    }
    return 'intermediate';
  }

  /**
   * Fast text matching across all relevant node metadata fields.
   */
  function matchesSearchText(node, query) {
    if (!query) return true;
    const q = query.trim().toLowerCase();
    if (!q) return true;

    // 1. Basic properties
    if ((node.id || '').toLowerCase().includes(q)) return true;
    if ((node.name || '').toLowerCase().includes(q)) return true;
    if ((node.plain_english_summary || '').toLowerCase().includes(q)) return true;
    if ((node.subsystem_name || '').toLowerCase().includes(q)) return true;
    if ((node.category || '').toLowerCase().includes(q)) return true;
    if ((node.tier_level || '').toLowerCase().includes(q)) return true;

    // 2. Mathematical formulation
    if (node.mathematical_formulation) {
      const mf = node.mathematical_formulation;
      if ((mf.latex_equation || '').toLowerCase().includes(q)) return true;
      if ((mf.algorithmic_proof || '').toLowerCase().includes(q)) return true;
      if (mf.variables) {
        for (const [k, v] of Object.entries(mf.variables)) {
          if (k.toLowerCase().includes(q) || String(v).toLowerCase().includes(q)) return true;
        }
      }
    }

    // 3. Code realization
    if (node.code_realization) {
      const cr = node.code_realization;
      if ((cr.file_path || '').toLowerCase().includes(q)) return true;
      if ((cr.signature || '').toLowerCase().includes(q)) return true;
      if ((cr.code_snippet || '').toLowerCase().includes(q)) return true;
    }

    // 4. Citations & failure modes
    if (node.citations) {
      const cit = node.citations;
      if ((cit.source_title || '').toLowerCase().includes(q)) return true;
      if ((cit.video_id_or_doi || '').toLowerCase().includes(q)) return true;
      if ((cit.category || '').toLowerCase().includes(q)) return true;
    }
    if (node.failure_modes) {
      const fm = node.failure_modes;
      if ((fm.edge_case || '').toLowerCase().includes(q)) return true;
      if ((fm.defense_mechanism || '').toLowerCase().includes(q)) return true;
    }

    return false;
  }

  /**
   * KnowledgeMatrixManager Controller
   */
  class KnowledgeMatrixManager {
    constructor(canvasEngine, graphData, deepDiveDrawer = null, container = null) {
      this.engine = canvasEngine;
      this.data = graphData || (canvasEngine && canvasEngine.data) || { nodes: [], edges: [], subsystems: [] };
      this.drawer = deepDiveDrawer;
      this.container = container || (typeof document !== 'undefined' ? document.body : null);

      this.allNodes = Array.isArray(this.data.nodes) ? [...this.data.nodes] : [];
      this.subsystems = Array.isArray(this.data.subsystems) ? [...this.data.subsystems] : [];

      this.isOpen = false;
      this.hudControls = null;

      this.currentFilters = Object.assign({}, DEFAULT_FILTERS);
      this.filteredNodes = [...this.allNodes];

      // Callbacks
      this.onMatrixOpen = null;
      this.onMatrixClose = null;
      this.onOpenDeepDive = null;
      this.onFocusGraph = null;

      this._init();
    }

    setHUDControls(hud) {
      this.hudControls = hud;
    }

    openMatrix() {
      if (this.isOpen) return;
      this.isOpen = true;

      const viewEl = this._getViewElement();
      if (viewEl) {
        viewEl.classList.add('matrix-open');
        viewEl.classList.add('visible');
        viewEl.style.display = 'flex';
      }

      this.filterEntities(this.currentFilters);

      if (this.hudControls && typeof this.hudControls.setPerspective === 'function') {
        if (this.hudControls.currentPerspective !== 'matrix') {
          this.hudControls.setPerspective('matrix');
        }
      }

      if (this.onMatrixOpen) {
        this.onMatrixOpen();
      }
    }

    closeMatrix() {
      if (!this.isOpen) return;
      this.isOpen = false;

      const viewEl = this._getViewElement();
      if (viewEl) {
        viewEl.classList.remove('matrix-open');
        viewEl.classList.remove('visible');
        viewEl.style.display = 'none';
      }

      if (this.hudControls && typeof this.hudControls.setPerspective === 'function') {
        if (this.hudControls.currentPerspective === 'matrix') {
          this.hudControls.setPerspective('code');
        }
      }

      if (this.onMatrixClose) {
        this.onMatrixClose();
      }
    }

    filterEntities(filters = null) {
      if (filters && typeof filters === 'object') {
        this.currentFilters = Object.assign({}, DEFAULT_FILTERS, filters);
      } else if (!this.currentFilters) {
        this.currentFilters = Object.assign({}, DEFAULT_FILTERS);
      }

      const { search, domain, complexity, category, sort } = this.currentFilters;

      let res = this.allNodes.filter(node => {
        // 1. Search Query
        if (search && !matchesSearchText(node, search)) {
          return false;
        }

        // 2. Domain Filter
        if (domain && domain !== 'all') {
          const domId = Number(domain);
          if (node.subsystem_id !== domId) {
            return false;
          }
        }

        // 3. Category Filter
        if (category && category !== 'all') {
          const normCat = category.toLowerCase().replace(/s$/, '');
          const nodeCat = (node.category || '').toLowerCase().replace(/s$/, '');
          if (normCat !== nodeCat) {
            return false;
          }
        }

        // 4. Complexity Filter
        if (complexity && complexity !== 'all') {
          const normComp = complexity.toLowerCase();
          const nodeComp = getNodeComplexity(node);
          if (nodeComp !== normComp) {
            return false;
          }
        }

        return true;
      });

      // Sort
      if (sort === 'domain') {
        res.sort((a, b) => (a.subsystem_id || 0) - (b.subsystem_id || 0));
      } else if (sort === 'tier') {
        const tierOrder = {
          'L0_Gateway': 0,
          'L1_Orchestration': 1,
          'L2_Strategy_Core': 2,
          'L3_Persistence': 3,
        };
        res.sort((a, b) => (tierOrder[a.tier_level] ?? 99) - (tierOrder[b.tier_level] ?? 99));
      } else if (sort === 'callers') {
        res.sort((a, b) => ((b.callers || []).length) - ((a.callers || []).length));
      } else if (sort === 'dependencies') {
        res.sort((a, b) => ((b.dependencies || []).length) - ((a.dependencies || []).length));
      } else {
        // Default: alphabetical by Name
        res.sort((a, b) => {
          const nameA = (a.name || a.id || '').toLowerCase();
          const nameB = (b.name || b.id || '').toLowerCase();
          return nameA.localeCompare(nameB);
        });
      }

      this.filteredNodes = res;
      this._updateSummaryBadge();
      this.renderCards();

      return this.filteredNodes;
    }

    selectCard(nodeId) {
      const viewEl = this._getViewElement();
      if (!viewEl) return;
      const cards = viewEl.querySelectorAll('.matrix-card');
      cards.forEach(c => {
        if (c.getAttribute('data-node-id') === nodeId) {
          c.classList.add('selected');
          c.classList.add('active');
          if (c.scrollIntoViewIfNeeded) c.scrollIntoViewIfNeeded();
        } else {
          c.classList.remove('selected');
          c.classList.remove('active');
        }
      });
    }

    handleAction(action, nodeId) {
      if (action === 'deep-dive') {
        if (this.drawer && typeof this.drawer.openDrawer === 'function') {
          this.drawer.openDrawer(nodeId);
        }
        if (this.onOpenDeepDive) {
          this.onOpenDeepDive(nodeId);
        }
      } else if (action === 'focus-graph') {
        this.closeMatrix();

        if (this.engine) {
          if (typeof this.engine.focusNode === 'function') {
            this.engine.focusNode(nodeId);
          }
          if (typeof this.engine.selectNode === 'function') {
            this.engine.selectNode(nodeId);
          }
        }

        if (this.hudControls && typeof this.hudControls.setPerspective === 'function') {
          this.hudControls.setPerspective('code');
        }

        if (this.onFocusGraph) {
          this.onFocusGraph(nodeId);
        }
      }
    }

    renderCards() {
      const viewEl = this._getViewElement();
      if (!viewEl) return;

      const grid = viewEl.querySelector('#matrix-card-grid') || viewEl.querySelector('.matrix-card-grid');

        const subInfo = SUBSYSTEM_INFO[node.subsystem_id] || { name: node.subsystem_name || `Domain ${node.subsystem_id}`, color: DEFAULT_COLOR };
        const subColor = subInfo.color;
        const subName = node.subsystem_name || subInfo.name;
        const callersCount = (node.callers || []).length;
        const depsCount = (node.dependencies || []).length;
        const catLabel = CATEGORY_LABELS[node.category] || node.category || 'Module';
        const tierLabel = node.tier_level || node.tier || 'L1';
        const complexity = getNodeComplexity(node);
        const compLabel = COMPLEXITY_LABELS[complexity] || complexity;

        let formulaHtml = '';
        if (node.mathematical_formulation && node.mathematical_formulation.latex_equation) {

              </button>

      }

      grid.innerHTML = cardsHtml;
    }

    _getViewElement() {
      if (!this.container) return null;
      return this.container.querySelector('#knowledge-matrix-view');
    }

    _updateSummaryBadge() {
      const viewEl = this._getViewElement();
      if (!viewEl) return;
      const badge = viewEl.querySelector('.matrix-summary-badge');
      if (!badge) return;

      const total = this.allNodes.length;
      const quantCount = this.allNodes.filter(n => n.category === 'quant_theory').length;
      const domainCount = 12;

      badge.textContent = `${total} ENTITIES · ${quantCount} QUANT MODULES · ${domainCount} DOMAINS`;
    }

    _init() {
      if (!this.container || typeof document === 'undefined') return;

      let viewEl = this.container.querySelector('#knowledge-matrix-view');
      if (!viewEl) {
        viewEl = document.createElement('div');
        viewEl.id = 'knowledge-matrix-view';
        viewEl.className = 'knowledge-matrix-view';
        this.container.appendChild(viewEl);
      } else {
        viewEl.innerHTML = '';
      }

      // Build Inner Layout
      viewEl.innerHTML = `
        <div class="matrix-container">
          <header class="matrix-header">
            <div class="matrix-header-left">
              <div class="matrix-title-group">
                <span class="matrix-icon">📚</span>
                <h1 class="matrix-title">KNOWLEDGE MATRIX & QUANT ENCYCLOPEDIA</h1>
              </div>
              <span class="matrix-summary-badge">${this.allNodes.length} ENTITIES · 16 QUANT MODULES · 12 DOMAINS</span>
            </div>
            <button id="matrix-close-btn" class="matrix-close-btn" title="Exit to Canvas (Esc)">
              ✕ Exit to Canvas
            </button>

    _bindEvents(viewEl) {
      // 1. Close Button
      const closeBtn = viewEl.querySelector('#matrix-close-btn');
      if (closeBtn) {
        closeBtn.addEventListener('click', () => {
          this.closeMatrix();
        });
      }

      // 2. Search Input
      const searchInput = viewEl.querySelector('#matrix-search-input');
      if (searchInput) {
        searchInput.addEventListener('input', () => {
          this.filterEntities({ ...this.currentFilters, search: searchInput.value });
        });
      }

      // 3. Filter Dropdowns
      const domainSelect = viewEl.querySelector('#matrix-domain-filter');
      if (domainSelect) {
        domainSelect.addEventListener('change', () => {
          this.filterEntities({ ...this.currentFilters, domain: domainSelect.value });
        });
      }

      const compSelect = viewEl.querySelector('#matrix-complexity-filter');
      if (compSelect) {
        compSelect.addEventListener('change', () => {
          this.filterEntities({ ...this.currentFilters, complexity: compSelect.value });
        });
      }

      const catSelect = viewEl.querySelector('#matrix-category-filter');
      if (catSelect) {
        catSelect.addEventListener('change', () => {
          this.filterEntities({ ...this.currentFilters, category: catSelect.value });
        });
      }

      const sortSelect = viewEl.querySelector('#matrix-sort-select');
      if (sortSelect) {
        sortSelect.addEventListener('change', () => {
          this.filterEntities({ ...this.currentFilters, sort: sortSelect.value });
        });
      }

      // 4. Card Grid Action Delegation
      const grid = viewEl.querySelector('#matrix-card-grid');
      if (grid) {
        grid.addEventListener('click', (e) => {
          const target = e.target;
          const actionBtn = (target.getAttribute && target.getAttribute('data-action'))
            ? target
            : (target.closest ? target.closest('[data-action]') : null);

          if (actionBtn) {
            const action = actionBtn.getAttribute('data-action');
            const nodeId = actionBtn.getAttribute('data-node-id');
            if (action && nodeId) {
              this.handleAction(action, nodeId);
            }
          }
        });
      }

      // 5. Global Escape Key Listener
      if (typeof window !== 'undefined') {
        window.addEventListener('keydown', (e) => {
          if (e.key === 'Escape' && this.isOpen) {
            this.closeMatrix();
          }
        });
      }
    }
  }

  function initKnowledgeMatrix(canvasEngine, graphData, deepDiveDrawer = null, container = null) {

  // Universal Module Export (Browser & CommonJS / Node)
  if (typeof module !== 'undefined' && module.exports) {
    module.exports = {
      KnowledgeMatrixManager,
      initKnowledgeMatrix,
      getNodeComplexity,
      matchesSearchText,
      SUBSYSTEM_INFO,
    };
  }

  if (typeof global !== 'undefined') {
    global.KnowledgeMatrixManager = KnowledgeMatrixManager;
    global.initKnowledgeMatrix = initKnowledgeMatrix;

  <script>
    // 6. Master Bootstrapping Orchestrator

// ============================================================================
// MASTER APPLICATION BOOTSTRAPPER & COMPONENT ORCHESTRATOR
// ============================================================================

(function () {
  'use strict';

  // Global Error Boundary Handler
  window.onerror = function (msg, url, lineNo, columnNo, error) {
    console.error('Visualizer Runtime Error:', msg, error);
    var banner = document.getElementById('error-boundary-banner');
    if (banner) {
      banner.style.display = 'block';
      banner.innerHTML = '<div class="error-banner-inner">' +
        '<strong>System Notice:</strong> ' +
        (msg || 'An unhandled exception occurred during execution.') +
        (lineNo ? ' (Line: ' + lineNo + ')' : '') +
        '</div>';
    }
    return false;
  };

  // Wait for full DOM readiness
  function bootStudio() {
    try {
      var payload = window.GRAPH_DATA;
      if (!payload || !payload.nodes) {
        console.error('CRITICAL: window.GRAPH_DATA payload not loaded.');
        return;
      }

      var canvas = document.getElementById('graph-canvas');
      var radarCanvas = document.getElementById('radar-canvas');

      // 1. Instantiate High-DPI Canvas 2D Engine
      var engine = new CanvasEngine({
        canvas: canvas,
        radarCanvas: radarCanvas,
        data: payload
      });

      // 2. Instantiate Institutional Command Bar & Floating HUDs
      var hud = initHUD(engine, payload, document.body);

      // 3. Instantiate Universal Deep-Dive Slide-Over Drawer
      var drawer = initDeepDiveDrawer(engine, payload);

      // 4. Instantiate 7-Stage Trade Lifecycle Guided Flight Simulator
      var tour = initLifecycleTour(engine, payload, document.body);

      // 5. Instantiate Searchable Knowledge Matrix & Encyclopedia
      var matrix = initKnowledgeMatrix(engine, payload, drawer, document.body);

      // 6. Two-Way State Synchronization
      if (hud && matrix) {
        hud.setKnowledgeMatrix(matrix);
        matrix.setHUDControls(hud);
      }

      // Wire Tour Mode trigger to Top Command Bar perspective switcher
      if (hud && tour) {
        var prevPerspectiveChange = hud.onPerspectiveChange;
        hud.onPerspectiveChange = function (perspectiveId) {
          if (typeof prevPerspectiveChange === 'function') {
            prevPerspectiveChange(perspectiveId);
          }
          if (perspectiveId === 'tour') {
            tour.startTour();
          } else {
            if (tour.isActive) tour.stopTour();
          }
        };
      }

      // 7. Boot with Default Island Layout & Trigger 60 FPS Animation Loop
      engine.setLayout('islands');
      engine.start();

      // Expose globally for browser console exploration and programmatic control
      window.__STUDIO_APP__ = {
        engine: engine,
        hud: hud,
        drawer: drawer,
        tour: tour,
        matrix: matrix,
        data: payload
      };

      console.log(
        '%c[Cyber-Quant HyperGraph Studio]%c Bootstrapped successfully with ' +
        payload.nodes.length + ' nodes, ' + payload.edges.length + ' edges, and ' +
        payload.subsystems.length + ' operational domains.',
        'color: #38bdf8; font-weight: bold; font-size: 13px;',
        'color: #94a3b8; font-size: 12px;'
      );
    } catch (err) {
      console.error('Fatal initialization error:', err);
      if (window.onerror) {
        window.onerror(err.message || String(err), 'bootStudio', 0, 0, err);
      }
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', bootStudio);
  } else {
    bootStudio();
  }
})();

  </script>
