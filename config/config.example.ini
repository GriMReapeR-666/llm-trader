; Copy to config.ini only in a local, ignored directory and replace every
; placeholder through environment variables or an approved secret manager.
[account]
login=YOUR_MT5_LOGIN
server=MetaQuotes-Demo
password_env=MT5_PASSWORD

[trading]
default_volume=0.01
default_symbols=XAUUSD,EURUSD,GBPJPY

[general]
log_level=INFO

[risk]
risk_per_trade=0.01
max_drawdown=0.10
slippage_tolerance=0.0005

[limits]
cooldown_seconds=300
max_trades_per_hour=5

[symbol_keywords]
xauusd=XAUUSD
eurusd=EURUSD
gbpjpy=GBPJPY
btcusd=BTCUSD
us30=US30

; Offline local agent memory (document/KV style).
; Local only. No network credentials required.
; Prefer env vars LOCAL_MEMORY_* (legacy LOCAL_MEMORY_* still accepted).
[local_memory]
enabled=false
path=local_agent_memory.db
max_active=5000
retention_days=90
compact_keep=200
