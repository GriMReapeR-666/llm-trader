[pytest]
pythonpath = .
testpaths = tests
python_files = test_*.py
norecursedirs = tui_opentui node_modules backups graphify-out .git .kilo .opencode archive scratch artifacts __pycache__
# -n 2, not -n auto -- a performance and flakiness choice, not a safety one.
#
# The original "-n auto" (12 workers on this 12-CPU host) used to abort the run
# with MemoryError, [WinError 1455] and native access violations. That root
# cause is now fixed at the source: tests/conftest.py sets
# LLM_TRADER_OPENBB_OFFLINE=1 and data/openbb_data_bridge.py honours it, so the
# import no longer builds OpenBB's 31-extension package index inside every
# worker. At -n auto the heaviest chunk now completes clean (296 passed, no
# MemoryError) instead of aborting.
#
# -n 2 is still the default because it measured both faster and cleaner here:
# 4m07s / 0 failures versus 8m28s / 1 failure on that same chunk. Twelve workers
# on a 7.4 GB box thrash. Raise it on a host with more RAM.
# -n 1 is the default: -n 2 (and -n auto) stalled on this host with frozen
# xdist worker runs (no log progress for >10 minutes) twice in Oct 2026.
# Serial mode is slower but reaches the end. Re-enable parallelism only on a
# host with more RAM/CPUs, and keep the stall-watch rule from the audit.
#
# Root cause (diagnosed 2026-10-23): the continuous live paper-trader
# (mt5_trader.py, engine.pid) alone holds ~8 GB of Windows commit charge on
# this 7.4 GB RAM box, leaving ~2 GB headroom. Under that pressure parallel
# workers die at allocation time with [WinError 1455] or freeze paging --
# the "gw node down / Not properly terminated (OSError 22)" signature.
# tests/conftest.py now enforces this as a failsafe: when free memory is
# below LLM_TRADER_TESTS_LOW_MEMORY_GB (default 2.0), any explicit -n N > 1
# or -n auto is downgraded to serial per session. Set the env var to 0 to
# benchmark parallelism deliberately on a quiet host.
addopts = --tb=short -q -n 1
filterwarnings =
    ignore::DeprecationWarning:curl_cffi.*
    ignore::DeprecationWarning:eventlet.*
    ignore::UserWarning
markers =
    fast: the under-five-minute gate (scripts/ci/fast_gate.py). Derived in
        tests/conftest.py: every test outside the slow lane. Run it with
        `python scripts/ci/fast_gate.py`.
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: fast unit tests
    drill: emergency and safety drills
